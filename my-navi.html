<script>
// Google Mapsの読み込み完了を検知（async読み込みなので、コールバック関数は先に定義しておく必要がある）
window._googleMapsReady = false;
function onGoogleMapsLoaded(){
  window._googleMapsReady = true;
  if(window._onGoogleMapsReadyCallback) window._onGoogleMapsReadyCallback();
}
// 初期言語を先に判定（Google Mapsのタイル言語はscriptタグのlanguageパラメータで一度だけ決まるため）
window._SUPPORTED_LANGS = ['ja','en','zh-CN','zh-TW','ko','es','fr','th','vi','de','ru','pt','ar','it','id'];
window._PLACES_LANG = { ja:'ja', en:'en', 'zh-CN':'zh-CN', 'zh-TW':'zh-TW', ko:'ko', es:'es', fr:'fr', th:'th', vi:'vi', de:'de', ru:'ru', pt:'pt-BR', ar:'ar', it:'it', id:'id' };
function _detectInitialLangEarly(){
  const saved = localStorage.getItem('navi_lang');
  if(saved && window._SUPPORTED_LANGS.includes(saved)) return saved;
  const nav = (navigator.language || 'en');
  const exact = window._SUPPORTED_LANGS.find(l => l.toLowerCase() === nav.toLowerCase());
  if(exact) return exact;
  const base = nav.split('-')[0];
  if(base === 'zh'){ return /TW|HK|MO/i.test(nav) ? 'zh-TW' : 'zh-CN'; }
  const baseMatch = window._SUPPORTED_LANGS.find(l => l.split('-')[0] === base);
  return baseMatch || 'en';
}
window._initialLang = _detectInitialLangEarly();
(function(){
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyAwuYMBSE85I1VMnG34H-E8JzY114YRSYE&libraries=places&loading=async&language=' + (window._PLACES_LANG[window._initialLang] || 'en') + '&callback=onGoogleMapsLoaded';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
})();
</script>

<style>

#bottom { background:#101014; border-top:2px solid #ff9f1c; flex-shrink:0; display:flex; flex-direction:column; }

.insert-btn:hover, .insert-btn.active { background:#001a33; border-color:#0066cc; color:#0099ff; }

.point-num { width:26px; height:26px; border-radius:50%; background:#1c1c23; border:2px solid #ff9f1c; color:#ff9f1c; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.point-row.current-row .point-num { width:36px; height:36px; font-size:15px; background:#ff9f1c; color:#000; border-color:#ff9f1c; }
.point-num.done { border-color:#3a3a46; color:#3a3a46; background:#101014; }

.point-info { flex:1; min-width:0; cursor:pointer; }
.point-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ccc; }
.point-row.current-row .point-name { font-size:16px; color:#ff9f1c; }
.point-memo-label { font-size:10px; color:#ff9f1c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.point-row.current-row .point-memo-label { font-size:12px; }

.point-del { background:#2a0000; border:1px solid #500; color:#ff6666; font-size:16px; font-weight:700; cursor:pointer; padding:6px 12px; border-radius:6px; flex-shrink:0; min-width:44px; min-height:36px; display:flex; align-items:center; justify-content:center; }
.point-del:active { background:#4a0000; }

.empty-msg { text-align:center; padding:20px 16px; color:#3a3a46; font-size:12px; line-height:2; }

/* インライン編集ポップアップ */
#edit-popup {
  display:none;
  position:fixed;
  z-index:8000;
  background:#15151a;
  border:1px solid #ff9f1c;

  padding:12px 14px;

}
#edit-popup.show { display:block; }
#edit-popup label { font-size:10px; color:#5e5e6b; display:block; margin-bottom:3px; letter-spacing:0.1em; text-transform:uppercase; }
#edit-popup input, #edit-popup textarea {
  width:100%; background:#0b0b0f; border:1px solid #2b2b35;

}
#edit-popup input:focus, #edit-popup textarea:focus { border-color:#ff9f1c; }
#edit-popup textarea { resize:none; height:52px; }

/* モーダル */

#modal-overlay.show { display:flex; }
#modal { background:#15151a; border-radius:16px 16px 0 0; padding:20px 18px 36px; width:100%; max-width:500px; border-top:1px solid #2b2b35; }
#modal h3 { font-size:14px; color:#ff9f1c; margin-bottom:14px; }
#modal label { font-size:10px; color:#5e5e6b; display:block; margin-bottom:4px; letter-spacing:0.1em; text-transform:uppercase; }
#modal input, #modal textarea, #modal select { width:100%; background:#0b0b0f; border:1px solid #2b2b35; border-radius:8px; color:#e9e9ee; padding:10px 12px; font-size:14px; outline:none; margin-bottom:12px; font-family:inherit; }
#modal input:focus, #modal textarea:focus, #modal select:focus { border-color:#ff9f1c; }
#modal textarea { resize:none; height:60px; }
#modal select option { background:#15151a; }
#modal-btns { display:flex; gap:8px; }
#modal-btns .btn { flex:1; padding:12px; font-size:14px; }
#position-row { display:none; }
#modal { max-height:92dvh; overflow-y:auto; }
.dlg-select { width:100%; background:#0b0b0f; border:1px solid #2b2b35; border-radius:8px; color:#e9e9ee; padding:9px 10px; font-size:13px; outline:none; margin-bottom:12px; font-family:inherit; }
.ml-row { display:flex; align-items:center; gap:6px; padding:8px 4px; border-bottom:1px solid #1c1c23; }
.ml-toggle { width:22px; flex-shrink:0; background:none; border:none; color:#7e7e8b; font-size:12px; cursor:pointer; padding:0; }
.ml-name { flex:1; min-width:0; font-size:13px; color:#e9e9ee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.ml-sub { font-size:11px; color:#6a6a76; }
.ml-vis { font-size:12px; flex-shrink:0; }
.ml-btn { flex-shrink:0; padding:4px 8px; border-radius:6px; font-size:12px; cursor:pointer; border:1px solid #3a3a46; background:#1c1c23; color:#9a9aa6; }
.ml-actions { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 4px 10px; border-bottom:1px solid #1c1c23; background:#17171d; }
.ml-actions select { background:#0b0b0f; border:1px solid #3a3a46; border-radius:6px; color:#e9e9ee; padding:4px 6px; font-size:12px; max-width:160px; }
.seg-mode-btn { flex:1; padding:8px 2px; background:#0b0b0f; border:2px solid #2b2b35; border-radius:8px; font-size:20px; cursor:pointer; }
.seg-mode-btn.active { border-color:#ff9f1c; background:#332800; }
.seg-color-btn { width:34px; height:34px; border-radius:50%; border:2px solid #3a3a46; cursor:pointer; padding:0; }
.seg-color-btn.active { border-color:#e9e9ee; box-shadow:0 0 0 2px #ff9f1c; }
.seg-row { display:flex; align-items:center; gap:6px; padding:2px 8px 2px 34px; }
.seg-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#9a9aa6; background:#17171d; border:1px solid #2a2a2a; border-radius:10px; padding:2px 8px; cursor:pointer; }
.seg-dash { flex:1; height:3px; border-radius:2px; }
.vis-btn.active { background:#ff9f1c; border-color:#ff9f1c; color:#000; }
.follow-tab { flex:1; padding:7px 2px; background:#1c1c23; border:1px solid #2b2b35; color:#9a9aa6; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.follow-tab.active { background:#ff9f1c; border-color:#ff9f1c; color:#000; }
.follow-row { display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid #1c1c23; }
.follow-name { flex:1; min-width:0; font-size:13px; color:#e9e9ee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.follow-act { padding:6px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; border:1px solid #3a3a46; background:#1c1c23; color:#9a9aa6; }
.follow-act.primary { background:#ff9f1c; border-color:#ff9f1c; color:#000; }
.follow-act.danger { background:#2a0000; border-color:#500; color:#ff6666; }
#icon-picker-row { display:none; margin-bottom:12px; }
#icon-current-btn { display:flex; align-items:center; gap:8px; width:100%; background:#0b0b0f; border:1px solid #2b2b35; border-radius:8px; color:#9a9aa6; padding:6px 12px; font-size:13px; cursor:pointer; }
#icon-current-btn:hover { border-color:#ff9f1c; }
#icon-current-preview { font-size:26px; line-height:1; display:inline-flex; align-items:center; }
#icon-grid { display:none; margin-top:8px; background:#0b0b0f; border:1px solid #2b2b35; border-radius:8px; padding:6px; }
#icon-grid.show { display:block; }
.icon-group { display:flex; flex-wrap:wrap; gap:2px; padding:4px 0; border-bottom:1px solid #1c1c23; }
.icon-group:last-child { border-bottom:none; }
.icon-cell { width:38px; height:38px; font-size:24px; line-height:1; background:transparent; border:2px solid transparent; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.icon-cell.selected { border-color:#ff9f1c; background:#332800; }
#icon-color-row { display:none; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
.color-cell { width:32px; height:32px; border-radius:50%; border:2px solid #3a3a46; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; padding:0; background:#0b0b0f; }

/* スマホ横向き */
@media (orientation:landscape) and (max-width:1024px) {
  body { flex-direction:row; }
  #map-wrap { flex:1; height:100%; }
  #bottom { width:250px; height:100%; border-top:none; border-left:2px solid #ff9f1c;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-right:env(safe-area-inset-right,0px); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

  /* パネル上部のつまみ（タップかスワイプで「欄だけ」表示に切り替え） */
  #panel-handle { display:flex; }

  /* ナビ表示を小さくまとめる */
  #nav-bar { padding:5px 8px 4px; }
  #nav-label { font-size:9px; margin-bottom:0; }
  #nav-name { font-size:13px; line-height:1.15; }
  #nav-memo-txt { font-size:10px; }
  #nav-sub { font-size:9px; margin-top:2px; }
  #nav-dist { font-size:12px !important; gap:8px !important; margin-top:3px !important; flex-wrap:wrap; }
  #dist-unit-btn { font-size:10px !important; padding:2px 6px !important; }

  #controls { padding:5px 6px; gap:4px; }
  #search-row { min-width:0; }
  #search-input { min-width:0; padding:6px 8px; font-size:12px; }
  #btn-row { gap:4px; }
  #bottom .btn { padding:6px 7px; font-size:11px; flex-shrink:0; }

  /* 欄だけを別にスクロールさせず、パネル全体を上下にドラッグできるようにする */
  #points-wrap { max-height:none; overflow:visible; flex:0 0 auto; }
  .point-row { padding:6px 8px; gap:6px; }
  .point-row.current-row { padding:9px 8px; }
  .point-name { font-size:11px; }
  .point-row.current-row .point-name { font-size:13px; }
  .point-num { width:22px; height:22px; font-size:10px; }
  .point-row.current-row .point-num { width:28px; height:28px; font-size:12px; }
  .point-del { min-width:32px; min-height:28px; padding:3px 7px; font-size:13px; }

  /* 「欄だけ」表示：ナビ表示と操作ボタンを隠して、ポイント欄を全部見せる */
  body.panel-list-only #nav-bar,
  body.panel-list-only #controls { display:none; }
  body.panel-list-only #points-wrap { min-height:0; }
}

/* PC */
@media (min-width:900px) {
  #nav-name { font-size:18px; }
  #controls { flex-direction:row; align-items:center; padding:8px 16px; gap:8px; }
  #search-row { flex:1; }
  #btn-row { flex-shrink:0; flex-wrap:nowrap; }
  #points-wrap { max-height:none; height:160px; display:flex; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-top:1px solid #1c1c23; align-items:stretch; }
  #points-wrap::-webkit-scrollbar { height:3px; }
  .point-row { flex-direction:column; align-items:flex-start; min-width:160px; max-width:160px; border-bottom:none; border-right:1px solid #15151a; padding:10px 12px; gap:4px; }
  .point-row.current-row { min-width:200px; max-width:200px; padding:14px 12px; border-left:none; border-top:3px solid #ff9f1c; }
  .point-name { white-space:normal; font-size:11px; }
  .insert-row { flex-direction:column; min-width:32px; max-width:32px; padding:8px 4px; border-right:1px solid #15151a; }
  .insert-btn { writing-mode:vertical-rl; padding:8px 2px; font-size:12px; width:auto; height:100%; }
  .empty-msg { min-width:300px; }
}
</style>

<body class="notranslate" translate="no">

<div id="map-wrap">
  <div id="map"></div>
  <div id="play-bar">
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="play-ctl" id="play-toggle" onclick="togglePlay()">⏸</button>
      <button class="play-ctl" onclick="restartPlay()">⟲</button>
      <input type="range" id="play-slider" min="0" max="1000" value="0" oninput="seekPlay(this.value)" style="flex:1;min-width:0;">
      <span id="play-dist" style="font-size:11px;color:#9a9aa6;white-space:nowrap;"></span>
      <button class="play-ctl" onclick="stopPlay()">✕</button>
    </div>

function detectInitialLang(){
  // headで既に判定済み（Google Mapsのlanguageパラメータと一致させるため）
  return window._initialLang || 'en';
}
let currentLang = detectInitialLang();

function t(key, vars){
  let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
  if(vars){
    Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}

function applyStaticTranslations(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // 動的に切り替わるボタン類は個別に再描画
  if(typeof renderList === 'function') renderList();
  const addBtn = document.getElementById('btn-add');
  if(addBtn && addBtn.dataset.state !== 'active'){ addBtn.textContent = t('add_point_btn'); }
  const routeBtn = document.getElementById('btn-route-mode');
  if(routeBtn){ routeBtn.textContent = typeof useRoad!=='undefined' && !useRoad ? t('route_mode_straight') : t('route_mode_road'); }
  const navBtn = document.getElementById('btn-nav');
  if(navBtn && typeof navActive!=='undefined'){ navBtn.textContent = navActive ? t('nav_stop_btn') : t('nav_start_btn'); }
  if(typeof updateUserBar === 'function') updateUserBar();
  const ph = document.getElementById('panel-handle-text');
  if(ph) ph.textContent = document.body.classList.contains('panel-list-only') ? t('panel_show_buttons') : t('panel_list_only');
}

function setLanguage(lang){
  if(!SUPPORTED_LANGS.includes(lang)) return;
  if(lang === currentLang) return;
  if(points.length && !confirm(t('confirm_lang_change_reload'))){
    const sel = document.getElementById('lang-select');
    if(sel) sel.value = currentLang;
    return;
  }
  localStorage.setItem('navi_lang', lang);
  location.reload();
}

function initLangSelector(){
  const sel = document.getElementById('lang-select');
  if(!sel) return;
  sel.innerHTML = SUPPORTED_LANGS.map(l=>`<option value="${l}">${LANG_NAMES[l]}</option>`).join('');
  sel.value = currentLang;
  sel.addEventListener('change', e=>setLanguage(e.target.value));
}

let googleLayer = null;
let usingGoogleMap = false;
let trafficLayerOn = false;
let bicyclingLayerOn = false;
let transitLayerOn = false;
let currentMapType = 'roadmap';

function useMapTilerFallback(){
  if(usingGoogleMap) return;
  L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
    attribution:'© <a href="https://www.maptiler.com/">MapTiler</a> © OpenStreetMap',
    maxZoom:19, tileSize:256
  }).addTo(map);
}

function initGoogleLayer(){
  try{
    googleLayer = L.gridLayer.googleMutant({ type: currentMapType }).addTo(map);
    usingGoogleMap = true;
  }catch(e){
    console.warn('Googleマップ読み込み失敗、MapTilerにフォールバック', e);
    useMapTilerFallback();
  }
}
if(window._googleMapsReady){
  initGoogleLayer();
} else {
  window._onGoogleMapsReadyCallback = initGoogleLayer;
}

function toggleMapControlsPanel(){

}

function setMapType(type){
  if(!usingGoogleMap){ alert(t('google_map_not_loaded')); return; }
  if(type === currentMapType) return;
  currentMapType = type;
  // 地形・航空写真・標準はGoogleMutantの type を切り替えるためレイヤーを作り直す
  if(googleLayer){ map.removeLayer(googleLayer); }
  googleLayer = L.gridLayer.googleMutant({ type: currentMapType }).addTo(map);
  // 切り替え後もオン中のレイヤー（渋滞・公共交通機関・自転車）を再適用
  if(trafficLayerOn) googleLayer.addGoogleLayer('TrafficLayer');
  if(transitLayerOn) googleLayer.addGoogleLayer('TransitLayer');
  if(bicyclingLayerOn) googleLayer.addGoogleLayer('BicyclingLayer');
  ['roadmap','satellite','terrain'].forEach(t=>{
    const btn = document.getElementById('maptype-'+t);
    const matches = (t === currentMapType) || (t === 'satellite' && currentMapType === 'hybrid');
    if(btn) btn.classList.toggle('active', matches);
  });
}

  trafficLayerOn = document.getElementById('layer-traffic-check').checked;
  if(trafficLayerOn){ googleLayer.addGoogleLayer('TrafficLayer'); }

function createGpsMarker(lat,lng){
  if(gpsIconData){
    const icon = L.divIcon({
      html:`<img src="${gpsIconData}" style="width:48px;height:48px;object-fit:contain;display:block;">`,
      iconSize:[48,48], iconAnchor:[24,24], className:''
    });
    return L.marker([lat,lng],{icon, interactive:false, zIndexOffset:1000}).addTo(map);
  }
  return L.circleMarker([lat,lng],{radius:9,color:'#2ea8ff',fillColor:'#2ea8ff',fillOpacity:1,weight:3}).addTo(map);
}

// アイコンを変えた時にマーカーを作り直す
function rebuildGpsMarker(){
  if(!gpsMarker) return;
  const ll = gpsMarker.getLatLng();
  map.removeLayer(gpsMarker);
  gpsMarker = createGpsMarker(ll.lat, ll.lng);
}

// ===== 起動時に現在地へ =====
function startGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(onGPS, onGPSErr, {enableHighAccuracy:true, maximumAge:2000, timeout:10000});
}
function onGPS(pos){
  const{latitude:lat, longitude:lng, accuracy}=pos.coords;
  const b=document.getElementById('gps-badge');
  b.textContent=t('gps_accuracy',{m:Math.round(accuracy)});
  b.className=accuracy<30?'good':accuracy<100?'':'bad';
  // 初回だけ現在地に移動
  if(!gpsInitialized){ map.setView([lat,lng],16); gpsInitialized=true; }
  if(!gpsMarker){
    gpsMarker=createGpsMarker(lat,lng);
    gpsCircle=L.circle([lat,lng],{radius:accuracy,color:'#2ea8ff',fillColor:'#2ea8ff',fillOpacity:0.08,weight:1}).addTo(map);
  }else{ gpsMarker.setLatLng([lat,lng]); gpsCircle.setLatLng([lat,lng]).setRadius(accuracy); }
  if(followMode)map.panTo([lat,lng]);
  if(navActive){
    checkProgress(lat,lng);
    // ナビバーの距離をリアルタイム更新
    if(navIndex<points.length){
      const tgt=points[navIndex];
      const d=calcDist(lat,lng,tgt.lat,tgt.lng);
      document.getElementById('nav-dist-next').textContent=t('dist_next_straight',{dist:formatDist(d)});
      // 残り = 現在地→次のポイント(直線) + 次のポイント→ゴール(道路)
      const roadRem=calcRemainingDist(); // 次のポイント以降の道路距離
      const totalRem = roadRem!==null ? d+roadRem : d;
      document.getElementById('nav-dist-goal').textContent=t('dist_remaining',{dist:formatDist(totalRem)});
    }
  }
}
function onGPSErr(){ const b=document.getElementById('gps-badge'); b.textContent=t('gps_error'); b.className='bad'; }

function toggleFollow(){
  if(!followMode){
    // followModeがOFF → 現在地に移動してON
    followMode=true;
    document.getElementById('follow-btn').classList.add('active');
    if(gpsMarker) map.panTo(gpsMarker.getLatLng());
  } else {
    // followModeがON → 現在地にポイント追加（followModeはONのまま）
    if(gpsMarker){
      const ll=gpsMarker.getLatLng();
      openModal({lat:ll.lat,lng:ll.lng},null,null);
    }
  }
}

let selectedIcon = '⭐';

// ⭐系なら'star'、🚩系なら'flag'、それ以外はnull
function iconBase(icon){
  if(!icon) return null;
  if(icon==='⭐' || icon.startsWith('star:')) return 'star';
  if(icon==='🚩' || icon.startsWith('flag:')) return 'flag';
  return null;
}
function iconColor(icon){
  const m = /^(?:star|flag):(#[0-9a-fA-F]{6})$/.exec(icon||'');
  return m ? m[1] : 'default';
}
// アイコンを表示用HTMLに変換（色付き⭐🚩はSVGで描く）
function iconHTML(icon, size){
  icon = icon || '⭐';
  const m = /^(star|flag):(#[0-9a-fA-F]{6})$/.exec(icon);
  if(m){
    const c = m[2];
    const edge = (c==='#1c1c1e') ? '#fff' : '#000';
    const shape = m[1]==='star'
      ? `<path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z" fill="${c}" stroke="${edge}" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>`
      : `<rect x="4" y="1.5" width="2.2" height="21" rx="1" fill="#777"/><path d="M6.2 2.5h14l-3.4 5 3.4 5h-14z" fill="${c}" stroke="${edge}" stroke-opacity="0.55" stroke-width="1.1" stroke-linejoin="round"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;">${shape}</svg>`;
  }
  return `<span style="font-size:${size}px;line-height:1;">${icon}</span>`;
}

function buildIconGrid(){
  const grid = document.getElementById('icon-grid');
  let idx = 0;
  grid.innerHTML = ICON_GROUPS.map(g =>
    `<div class="icon-group">${g.map(ic => `<button type="button" class="icon-cell" data-idx="${idx++}" onclick="pickIconIdx(${idx-1})">${ic}</button>`).join('')}</div>`
  ).join('');
}

  const base = iconBase(selectedIcon);
  document.querySelectorAll('#icon-grid .icon-cell').forEach(b=>{
    const ic = ICON_LIST[parseInt(b.dataset.idx)];
    const on = base ? (iconBase(ic)===base) : (ic===selectedIcon);
    b.classList.toggle('selected', on);
  });
  const colorRow = document.getElementById('icon-color-row');
  if(base){
    const cur = iconColor(selectedIcon);
    const baseEmoji = base==='star' ? '⭐' : '🚩';
    colorRow.innerHTML = `<span style="font-size:11px;color:#777;margin-right:2px;">${t('color_label')}</span>` +
      ICON_COLORS.map(c => {
        const inner = c==='default' ? baseEmoji : '';
        const bg = c==='default' ? '#0b0b0f' : c;
        return `<button type="button" class="color-cell${c===cur?' selected':''}" style="background:${bg};" onclick="pickIconColor('${c}')">${inner}</button>`;
      }).join('');
    colorRow.style.display = 'flex';
  } else {
    colorRow.style.display = 'none';
    colorRow.innerHTML = '';
  }
}

function pickIconIdx(i){
  const ic = ICON_LIST[i];
  // 同じ⭐/🚩を押し直した時は色を保持
  if(iconBase(ic) && iconBase(ic)===iconBase(selectedIcon)) { refreshIconPicker(); return; }
  selectedIcon = ic;
  refreshIconPicker();
}

function pickIconColor(c){
  const base = iconBase(selectedIcon);
  if(!base) return;
  selectedIcon = (c==='default') ? (base==='star' ? '⭐' : '🚩') : `${base}:${c}`;
  refreshIconPicker();
}

    sel.innerHTML='';

    optEnd.value=points.length;
    optEnd.textContent=t('insert_pos_end_option',{n:points.length+1});
    optEnd.selected=true;
    sel.appendChild(optEnd);
    for(let i=1;i<points.length;i++){
      const opt=document.createElement('option');
      opt.value=i;
      opt.textContent=t('insert_pos_between_option',{n:i+1,a:i,b:i+1});
      sel.appendChild(opt);
    }

  } else if(points.length>=2 && document.getElementById('position-row').style.display!=='none'){
    return parseInt(document.getElementById('modal-position').value);

function insertRoutePointAt(name, memo, lat, lng, fixedPointId, icon){
  const p={id:Date.now(), lat, lng, name, memo, marker:null};
  if(fixedPointId){ p.fixedPointId = fixedPointId; p.icon = icon || '⭐'; }
  const insertAt = determineInsertPosition();
  points.splice(insertAt,0,p);
  invalidateSeg(insertAt-1);
  // 前のポイントからこのポイントまでの区間に、選んだ移動手段を使う
  if(insertAt>0 && points[insertAt-1]) points[insertAt-1].segMode = modalSegMode;
  rebuildAllMarkers();
  updatePolyline();
  renderList();
}

async function confirmModal(){
  const name=document.getElementById('modal-name').value.trim();
  const memo=document.getElementById('modal-memo-input').value.trim();
  const icon=selectedIcon || '⭐';
  const fpMeta = getFixedMeta();

  if(convertingRoutePointId!==null){
    // 普通のルートポイントを固定ポイントに変換
    const ok = await convertRoutePointToFixed(convertingRoutePointId, name, memo, icon, fpMeta);
    if(!ok) return;
  } else if(editingLinkedRoutePointId!==null){
    // ルート上の固定ポイントを編集：本体（saved_points）を更新し、ルート側の表示も同期
    const rp = points.find(x=>x.id===editingLinkedRoutePointId);
    if(rp){
      try{
        const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${rp.fixedPointId}`, {
          method: 'PATCH',
          prefer: 'return=minimal',
          body: JSON.stringify({ name, memo, icon, ...fpMeta })
        });
        if(res.ok){
          syncLinkedRoutePoints(rp.fixedPointId, name, memo, icon);
          loadSavedPoints();
        } else {
          alert(t('alert_save_fail',{err: await res.text()}));
          return;
        }
      }catch(e){
        alert(t('err_network'));
        return;
      }
    }
  } else if(editingFixedPoint!==null){
    // 既存の固定ポイントを編集
    try{
      const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${editingFixedPoint.id}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: JSON.stringify({ name, memo, icon, ...fpMeta })
      });
      if(res.ok){
        syncLinkedRoutePoints(editingFixedPoint.id, name, memo, icon);
        const addToRoute = document.getElementById('fixedpoint-route-toggle').style.display!=='none'
          && document.getElementById('fixedpoint-add-to-route').checked;
        if(addToRoute) addFixedPointToRoute({ ...editingFixedPoint, name, memo, icon, ...fpMeta });
        loadSavedPoints();
      } else {
        alert(t('alert_save_fail',{err: await res.text()}));
        return;
      }
    }catch(e){
      alert(t('err_network'));
      return;
    }
  } else if(editingId!==null){
    const p=points.find(x=>x.id===editingId);
    p.name=name; p.memo=memo;
    refreshAllMarkers(); renderList();
  } else if(modalTarget==='fixedpoint'){
    // 新規固定ポイントとして保存（＋任意でルート番号も付与）
    if(!pendingLatLng)return;
    if(!currentUser){ showAuthScreen(); return; }
    try{
      const newId = crypto.randomUUID();
      const res = await supabaseFetch('/rest/v1/saved_points', {
        method: 'POST',
        prefer: 'return=minimal',
        body: JSON.stringify({
          id: newId,
          user_id: currentUser.id,
          name, memo, icon, ...fpMeta,
          lat: pendingLatLng.lat, lng: pendingLatLng.lng
        })
      });
      if(res.ok){
        addSavedPointMarker({ id:newId, user_id:currentUser.id, name, memo, icon, ...fpMeta, lat:pendingLatLng.lat, lng:pendingLatLng.lng });
        const addToRoute = document.getElementById('fixedpoint-add-to-route').checked;
        if(addToRoute){
          insertRoutePointAt(name, memo, pendingLatLng.lat, pendingLatLng.lng, newId, icon);
        }
      } else {
        alert(t('alert_save_fail',{err: await res.text()}));
        return;
      }
    }catch(e){
      alert(t('err_network'));
      return;
    }
  } else {
    if(!pendingLatLng)return;
    insertRoutePointAt(name, memo, pendingLatLng.lat, pendingLatLng.lng);
  }

  document.getElementById('modal-overlay').classList.remove('show');
  const wasInsert=insertAfterIndex!==null;
  pendingLatLng=null; editingId=null; insertAfterIndex=null; editingFixedPoint=null; editingLinkedRoutePointId=null; convertingRoutePointId=null;
  if(typeof clearSearchResults==='function') clearSearchResults();
  // addModeは常に継続（連続追加可能）
  // 挿入ボタンのハイライトだけ解除
  insertAfterIndex=null;
  document.querySelectorAll('.insert-btn').forEach(b=>b.classList.remove('active'));
  if(addMode){
    const btn=document.getElementById('btn-add');
    btn.textContent=t('add_point_btn_active'); btn.className='btn btn-add-active';
  }
}

function getState(idx){

function addMarker(p,idx){
  const isLinked = !!p.fixedPointId;
  const icon = p.icon ? makeLinkedIcon(idx,getState(idx),p.icon) : makeIcon(idx,getState(idx));
  const m=L.marker([p.lat,p.lng],{icon, draggable: !isLinked && addMode}).addTo(map);

    });

      if(addMode) _openEditFromMarker(p.id);

}

// 全マーカーを削除して再生成（挿入時に番号を正しく振り直す）
function rebuildAllMarkers(){
  points.forEach(p=>{if(p.marker){map.removeLayer(p.marker);p.marker=null;}});
  points.forEach((p,i)=>addMarker(p,i));
}

function refreshAllMarkers(){
  points.forEach((p,i)=>{
    if(!p.marker)return;
    const icon = p.icon ? makeLinkedIcon(i,getState(i),p.icon) : makeIcon(i,getState(i));
    p.marker.setIcon(icon);

// ===== ポリライン =====
function clearPolylines(){ polylines.forEach(l=>map.removeLayer(l)); polylines=[]; }

// ===== 区間（ポイントとポイントの間）の移動手段と線の色 =====
// 区間 i は points[i] → points[i+1]。設定は points[i] に持たせる（segMode / segColor）
const SEG_MODES = ['car','foot','bike','train','plane'];
const SEG_ICONS = { car:'🚗', foot:'🚶', bike:'🚲', train:'🚃', plane:'✈️' };
const SEG_DEFAULT_COLORS = { car:'#ff9f1c', foot:'#2fd6a5', bike:'#45c7ff', train:'#9b7bff', plane:'#ff5c8a' };
const SEG_COLOR_CHOICES = ['#ff9f1c','#2fd6a5','#45c7ff','#9b7bff','#ff5c8a','#ffffff','#e8e8ea','#00d5c8'];
// 道に沿わせる移動手段だけ経路を取りに行く（電車と飛行機は点線でまっすぐ）
const SEG_PROFILE = { car:'routed-car', foot:'routed-foot', bike:'routed-bike' };
const routeGeoCache = {};
let polyToken = 0;

function segModeOf(i){ return (points[i] && points[i].segMode) || 'car'; }
function segColorOf(i){ return (points[i] && points[i].segColor) || SEG_DEFAULT_COLORS[segModeOf(i)]; }
function segIsStraight(mode){ return !SEG_PROFILE[mode]; }

async function fetchSegmentGeometry(a, b, mode){
  const key = `${mode}|${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
  if(routeGeoCache[key]) return routeGeoCache[key];
  const url = `https://routing.openstreetmap.de/${SEG_PROFILE[mode]}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&continue_straight=true`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code!=='Ok' || !data.routes.length) throw new Error('no route');
  const out = { geometry: data.routes[0].geometry, distance: data.routes[0].distance };
  routeGeoCache[key] = out;
  return out;
}

// 区間の道のりの長さを測る
function pathLength(coords){
  let d=0;
  for(let k=1;k<coords.length;k++) d += calcDist(coords[k-1][0],coords[k-1][1],coords[k][0],coords[k][1]);
  return d;
}

// この区間の線を引き直す必要をなくす（覚えている線を捨てる）
function invalidateSeg(i){ if(points[i]) delete points[i].segPath; }
function invalidateAllSegs(){ points.forEach(p=>delete p.segPath); }

async function updatePolyline(){
  clearPolylines();
  if(points.length<2) return;
  const token = ++polyToken;
  const dists = [];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const mode = segModeOf(i), color = segColorOf(i);
    const dash = (mode==='train'||mode==='plane') ? '12,8' : null;
    // すでに引いてある線があれば、それをそのまま使う（移動手段を変えても道は変えない）
    if(a.segPath && a.segPath.length>1 && useRoad){
      const line = L.polyline(a.segPath, {color, weight:5, opacity:0.85, dashArray:dash}).addTo(map);
      polylines.push(line);
      dists[i] = pathLength(a.segPath);
      continue;
    }
    const straight = !useRoad || segIsStraight(mode);
    const tmp = L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
      { color, weight: straight?4:3, opacity: straight?0.9:0.35,
        dashArray: dash || (straight ? null : '6,6') }).addTo(map);
    polylines.push(tmp);
    dists[i] = calcDist(a.lat,a.lng,b.lat,b.lng);
    if(straight) continue;
    try{
      const r = await fetchSegmentGeometry(a,b,mode);
      if(token!==polyToken){ if(map.hasLayer(tmp)) map.removeLayer(tmp); return; }
      map.removeLayer(tmp); polylines = polylines.filter(l=>l!==tmp);
      const coords = r.geometry.coordinates.map(c=>[+c[1].toFixed(5), +c[0].toFixed(5)]);
      a.segPath = coords; // 覚えておく
      const line = L.polyline(coords, {style:null, color, weight:5, opacity:0.85}).addTo(map);
      polylines.push(line);
      dists[i] = r.distance;
    }catch(e){ console.warn('経路取得に失敗', e); }
  }
  if(token!==polyToken) return;
  segmentDistances = dists;
  renderList();
}

// ===== 再生モード（ルートの線が伸びていく） =====
let playLayer = null;       // 再生用の線とアイコンを入れる層
let playSegs = [];          // 区間ごとの座標と色
let playTotal = 0;          // 全体の距離(m)
let playPos = 0;            // 今どこまで進んだか(m)
let playSpeed = 1;          // 速度倍率
let playRunning = false;
let playRAF = null;
let playLastT = 0;
let playMarker = null;
let playLineMode = 'trail'; // trail=通ったぶんだけ / highlight=全部薄く＋通過を濃く / all=最初から全部
let playBaseLines = [], playProgLines = [];
let playHiddenMarkers = [];

function playIconHTML(deg){
  const inner = gpsIconData
    ? `<img src="${gpsIconData}" style="width:44px;height:44px;object-fit:contain;display:block;">`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2ea8ff" stroke="#fff" stroke-width="2"/><path d="M12 5l4 9-4-2-4 2z" fill="#fff"/></svg>`;
  return `<div style="transform:rotate(${deg}deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));">${inner}</div>`;
}

// 区間ごとの座標を用意する（道に沿う区間は経路を取得、電車・飛行機は直線）
async function buildPlaySegments(){
  const segs = [];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const mode = segModeOf(i), color = segColorOf(i);
    let coords = [[a.lat,a.lng],[b.lat,b.lng]];
    if(a.segPath && a.segPath.length>1 && useRoad){
      coords = a.segPath;
    } else if(useRoad && !segIsStraight(mode)){
      try{
        const r = await fetchSegmentGeometry(a,b,mode);
        coords = r.geometry.coordinates.map(c=>[c[1],c[0]]);
      }catch(e){ /* 取れなければ直線 */ }
    }
    // 区間内の距離の積み上げ
    const cum=[0];
    for(let k=1;k<coords.length;k++){
      cum.push(cum[k-1] + calcDist(coords[k-1][0],coords[k-1][1],coords[k][0],coords[k][1]));
    }
    segs.push({ coords, cum, len: cum[cum.length-1], color, mode, endIndex: i+1 });
  }
  return segs;
}

async function startPlayback(){
  if(points.length<2){ alert(t('play_need_points')); return; }
  toggleMapControlsPanel();
  stopPlay(true);
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  playSegs = await buildPlaySegments();
  playTotal = playSegs.reduce((a,s)=>a+s.len,0);
  if(!playTotal){ alert(t('play_need_points')); return; }
  playLayer = L.layerGroup().addTo(map);
  // ルートの線とピンはいったん隠す
  clearPolylines();
  playHiddenMarkers = [];
  points.forEach(p=>{ if(p.marker){ p.marker.setOpacity(0); playHiddenMarkers.push(p.marker); } });
  buildPlayLines();
  playMarker = L.marker(playSegs[0].coords[0], {icon:L.divIcon({html:playIconHTML(0), iconSize:[44,44], iconAnchor:[22,22], className:''}), zIndexOffset:2000}).addTo(playLayer);
  playPos = 0;
  map.setView(playSegs[0].coords[0], Math.max(map.getZoom(),15));
  document.getElementById('play-bar').classList.add('show');
  document.getElementById('play-slider').value = 0;
  setPlayLineModeLabels();
  playRunning = true;
  document.getElementById('play-toggle').textContent = '⏸';
  playLastT = performance.now();
  playRAF = requestAnimationFrame(playStep);
}

function buildPlayLines(){
  playBaseLines.forEach(l=>playLayer.removeLayer(l));
  playProgLines.forEach(l=>playLayer.removeLayer(l));
  playBaseLines = []; playProgLines = [];
  playSegs.forEach(sg=>{
    if(playLineMode!=='trail'){
      const op = playLineMode==='highlight' ? 0.25 : 0.85;
      const base = L.polyline(sg.coords, {color:sg.color, weight:4, opacity:op,
        dashArray:(sg.mode==='train'||sg.mode==='plane')?'12,8':null}).addTo(playLayer);
      playBaseLines.push(base);
    }
    const prog = L.polyline([], {color:sg.color, weight:6, opacity:0.95,
      dashArray:(sg.mode==='train'||sg.mode==='plane')?'12,8':null}).addTo(playLayer);
    playProgLines.push(prog);
  });
}

function setPlayLineMode(v){
  playLineMode = v;
  if(!playLayer) return;
  buildPlayLines();
  drawPlayAt(playPos);
}

function setPlayLineModeLabels(){
  const sel = document.getElementById('play-line-mode');
  sel.options[0].textContent = t('play_line_trail');
  sel.options[1].textContent = t('play_line_highlight');
  sel.options[2].textContent = t('play_line_all');
  sel.value = playLineMode;
}

// 今の進み具合に合わせて線とアイコンを描く
function drawPlayAt(dist){
  let remain = dist, pos = null, heading = 0, reached = 0;
  for(let i=0;i<playSegs.length;i++){
    const sg = playSegs[i];
    if(remain >= sg.len){
      playProgLines[i].setLatLngs(sg.coords);
      remain -= sg.len;
      reached = sg.endIndex;
      if(i===playSegs.length-1){ pos = sg.coords[sg.coords.length-1]; heading = headingOf(sg.coords, sg.coords.length-1); }
      continue;
    }
    // この区間の途中
    let k=1;
    while(k<sg.cum.length && sg.cum[k] < remain) k++;
    const a = sg.coords[k-1], b = sg.coords[Math.min(k, sg.coords.length-1)];
    const segLen = sg.cum[Math.min(k, sg.cum.length-1)] - sg.cum[k-1];
    const f = segLen>0 ? (remain - sg.cum[k-1])/segLen : 0;
    pos = [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
    heading = bearing(a[0],a[1],b[0],b[1]);
    playProgLines[i].setLatLngs(sg.coords.slice(0,k).concat([pos]));
    for(let j=i+1;j<playSegs.length;j++) playProgLines[j].setLatLngs([]);
    break;
  }
  if(!pos){ const last = playSegs[playSegs.length-1]; pos = last.coords[last.coords.length-1]; }
  playMarker.setLatLng(pos);
  playMarker.setIcon(L.divIcon({html:playIconHTML(heading), iconSize:[44,44], iconAnchor:[22,22], className:''}));
  // 通り過ぎたポイントのピンを出す
  points.forEach((p,idx)=>{ if(p.marker) p.marker.setOpacity(idx<=reached ? 1 : 0); });
  if(document.getElementById('play-follow').checked) map.panTo(pos, {animate:false});
  document.getElementById('play-dist').textContent = formatDist(dist) + ' / ' + formatDist(playTotal);
  document.getElementById('play-slider').value = Math.round(dist/playTotal*1000);
}

function headingOf(coords, i){
  const a = coords[Math.max(0,i-1)], b = coords[i];
  return bearing(a[0],a[1],b[0],b[1]);
}

function bearing(lat1,lng1,lat2,lng2){
  const φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180, Δλ=(lng2-lng1)*Math.PI/180;
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

const PLAY_BASE_SPEED = 100; // 1倍のとき1秒あたり100m進む
function playStep(now){
  if(!playRunning) return;
  const dt = Math.min((now-playLastT)/1000, 0.1);
  playLastT = now;
  playPos += PLAY_BASE_SPEED * playSpeed * dt;
  if(playPos >= playTotal){
    playPos = playTotal;
    drawPlayAt(playPos);
    playRunning = false;
    document.getElementById('play-toggle').textContent = '▶';
    return;
  }
  drawPlayAt(playPos);
  playRAF = requestAnimationFrame(playStep);
}

function togglePlay(){
  if(!playLayer) return;
  if(playRunning){
    playRunning = false;
    document.getElementById('play-toggle').textContent = '▶';
  } else {
    if(playPos >= playTotal) playPos = 0;
    playRunning = true;
    document.getElementById('play-toggle').textContent = '⏸';
    playLastT = performance.now();
    playRAF = requestAnimationFrame(playStep);
  }
}

function restartPlay(){
  if(!playLayer) return;
  playPos = 0;
  drawPlayAt(0);
  if(!playRunning) togglePlay();
}

function seekPlay(v){
  if(!playLayer) return;
  playPos = playTotal * (v/1000);
  drawPlayAt(playPos);
}

function stopPlay(silent){
  playRunning = false;
  if(playRAF) cancelAnimationFrame(playRAF);
  if(playLayer){ map.removeLayer(playLayer); playLayer = null; }
  playBaseLines = []; playProgLines = []; playMarker = null; playSegs = [];
  points.forEach(p=>{ if(p.marker) p.marker.setOpacity(1); });
  document.getElementById('play-bar').classList.remove('show');
  if(!silent) updatePolyline();
}

// ===== ポイントリスト =====
function renderList(){
  const el=document.getElementById('points-wrap');
  if(!points.length){el.innerHTML=`<div class="empty-msg">${t('empty_points_msg')}<br>${t('empty_points_sub')}</div>`;refreshSavedPointVisibility();return;}

  let html='';
  points.forEach((p,i)=>{
    const state=getState(i);
    const rowClass=state==='cur'?'current-row':state==='done'?'done-row':'';
    const numClass=state==='done'?'done':'';
    const displayName=p.name||'';
    const isLinked = !!p.fixedPointId;
    const starPrefix = p.icon ? `<span style="display:inline-flex;align-items:center;">${iconHTML(p.icon,16)}</span>` : '';
    const numOnclick = !addMode
      ? `focusPoint(${p.id})`
      : (isLinked
        ? `_suppressMapClick=true; openLinkedRoutePointModal(${p.id})`
        : `_suppressMapClick=true; openEditPopup(${p.id}, this)`);

    // 先頭の前に挿入ボタン（ポイントが2つ以上の時のみ）
    if(addMode && i===0 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="-1" onclick="startInsertAt(-1)">＋</button></div>`;
    }

    const segDist = segmentDistances[i] != null ? formatDist(segmentDistances[i]) : '';
    html+=`<div class="point-row ${rowClass}">
      ${starPrefix}
      <div class="point-num ${numClass}" onclick="${numOnclick}" style="cursor:pointer;">${i+1}</div>
      <div class="point-info" onclick="focusPoint(${p.id})">
        <div class="point-name">${displayName}</div>
        ${p.memo?`<div class="point-memo-label">📝 ${p.memo}</div>`:''}
        ${segDist?`<div style="font-size:13px;color:#7e7e8b;margin-top:2px;">→ ${segDist}</div>`:''}
      </div>
      ${addMode?`<button class="point-del" onclick="deletePoint(${p.id})">✕</button>`:''}
    </div>`;

    // ポイントとポイントの間に挿入ボタン（ポイントが2つ以上の時のみ）
    if(i<points.length-1){
      const m = segModeOf(i), c = segColorOf(i);
      const dashStyle = (m==='train'||m==='plane')
        ? `background:repeating-linear-gradient(90deg, ${c} 0 8px, transparent 8px 14px);`
        : `background:${c};`;
      html+=`<div class="seg-row">
        <span class="seg-chip" ${addMode?`onclick="openSegDialog(${i})"`:''}>${SEG_ICONS[m]}${addMode?' ▾':''}</span>
        <span class="seg-dash" style="${dashStyle}"></span>
      </div>`;
    }
    if(addMode && i<points.length-1 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="${i}" onclick="startInsertAt(${i})">＋</button></div>`;
    }
  });

  el.innerHTML=html;
  refreshSavedPointVisibility();
  if(navActive){
    const rows=el.querySelectorAll('.point-row');
    if(rows[navIndex])rows[navIndex].scrollIntoView({behavior:'smooth',block:'center'});
  }
  setTimeout(updateScrollBtns,50);
}

function focusPoint(id){
  const p=points.find(x=>x.id===id);
  if(!p)return;
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));
}

function deletePoint(id){
  const i=points.findIndex(x=>x.id===id);
  if(i===-1)return;
  map.removeLayer(points[i].marker);
  points.splice(i,1);
  invalidateSeg(i-1);
  if(navActive&&i<navIndex)navIndex--;
  if(navActive&&navIndex>=points.length)navIndex=Math.max(0,points.length-1);
  if(points.length===0)clearPolylines();
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  if(navActive)updateNavBar();
}

// ===== 施設・住所検索（Google Places API） =====
let searchMarkers = [];
let searchResults = [];

function clearSearchResults(){
  searchMarkers.forEach(m=>map.removeLayer(m));
  searchMarkers = [];
  searchResults = [];
  const el = document.getElementById('search-results');
  el.classList.remove('show');
  el.innerHTML = '';
}

// 検索結果のピン：種類ごとに色を変える（📍地図の場所=ピンク、⭐固定ポイント=緑、🛣ルート上=オレンジ）
const SEARCH_COLORS = { place:'#ff5c8a', fixed:'#2fd6a5', route:'#ff9f1c' };

function makeSearchIcon(kind, icon){
  const c = SEARCH_COLORS[kind] || SEARCH_COLORS.place;
  const pin = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 34 44">
      <path d="M17 0C7.6 0 0 7.6 0 17c0 11 17 27 17 27s17-16 17-27C34 7.6 26.4 0 17 0z" fill="${c}"/>
      <circle cx="17" cy="17" r="7" fill="#fff"/></svg>`;
  if(kind==='place'){
    return L.divIcon({ html: pin, iconSize:[28,36], iconAnchor:[14,36], className:'' });
  }
  // 固定ポイント・ルート上のポイントは、そのアイコンを下に重ねる
  return L.divIcon({
    html:`<div style="display:flex;flex-direction:column;align-items:center;width:28px;">${pin}<div style="margin-top:-8px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6));">${iconHTML(icon||'⭐',20)}</div></div>`,
    iconSize:[28,52], iconAnchor:[14,40], className:''
  });
}

// 検索：自分の固定ポイント・ルートポイントの名前とメモ → そのあと地図の場所（10km以内）
async function searchAddress(){
  const q=document.getElementById('search-input').value.trim();
  if(!q)return;
  const btn=document.querySelector('#search-row .btn-orange');
  btn.textContent='...';btn.disabled=true;
  clearSearchResults();
  const center = map.getCenter();
  const results = [];
  const needle = q.toLowerCase();
  const hit = (a,b) => (a||'').toLowerCase().includes(needle) || (b||'').toLowerCase().includes(needle);

  // 自分の固定ポイント
  savedPoints.forEach(p=>{
    if(hit(p.name,p.memo)) results.push({ kind:'fixed', name:p.name||'—', memo:p.memo||'', icon:p.icon, ref:p,
      lat:p.lat, lng:p.lng, dist:calcDist(center.lat,center.lng,p.lat,p.lng) });
  });
  // 今のルートのポイント
  points.forEach((p,i)=>{
    if(hit(p.name,p.memo)) results.push({ kind:'route', name:p.name||t('nav_point_default',{n:i+1}), memo:p.memo||'', icon:p.icon||'🛣',
      lat:p.lat, lng:p.lng, dist:calcDist(center.lat,center.lng,p.lat,p.lng) });
  });

  try{
    if(!window.google || !google.maps || !google.maps.places){
      if(!results.length){ alert(t('alert_search_not_ready')); return; }
    } else {
      const { Place } = await google.maps.importLibrary('places');
      const { places } = await Place.searchByText({
        textQuery: q,
        fields: ['displayName','location','formattedAddress'],
        locationBias: { center: { lat: center.lat, lng: center.lng }, radius: 10000 },
        maxResultCount: 10,
        language: PLACES_LANG[currentLang] || 'en'
      });
      (places||[]).forEach(pl=>{
        const lat = pl.location.lat(), lng = pl.location.lng();
        results.push({ kind:'place', name: pl.displayName || q, memo: pl.formattedAddress || '',
          lat, lng, dist: calcDist(center.lat,center.lng,lat,lng) });
      });
    }
  }catch(e){
    console.error(e);
    if(!results.length){ alert(t('alert_search_fail')); return; }
  }finally{
    btn.textContent=t('search_btn');btn.disabled=false;
  }

  if(!results.length){ alert(t('alert_search_notfound')); return; }
  results.sort((a,b)=>a.dist-b.dist);
  searchResults = results;
  renderSearchResults();
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  // 候補が全部入るように地図を広げる（1件だけならその場所へ移動）
  if(results.length===1) map.setView([results[0].lat, results[0].lng], 16);
  else map.fitBounds(results.map(r=>[r.lat,r.lng]), {padding:[60,60], maxZoom:16});
}

function renderSearchResults(){
  const el = document.getElementById('search-results');
  searchMarkers.forEach(m=>map.removeLayer(m));
  searchMarkers = searchResults.map((r,i)=>{
    const m = L.marker([r.lat,r.lng],{icon:makeSearchIcon(r.kind, r.icon), zIndexOffset:500}).addTo(map);
    m.bindTooltip(r.name,{direction:'top',offset:[0,-34]});
    m.on('click', e=>{ L.DomEvent.stopPropagation(e); showSearchPopup(e.latlng, i); });
    return m;
  });
  el.innerHTML = `<div class="sr-head"><span>${t('search_results_title',{n:searchResults.length})}</span>
      <button class="ml-btn" style="padding:2px 8px;" onclick="clearSearchResults()">✕</button></div>` +
    searchResults.map((r,i)=>`<div class="sr-row" style="border-left:3px solid ${SEARCH_COLORS[r.kind]||SEARCH_COLORS.place};">
      <div class="sr-name" onclick="gotoSearchResult(${i})">${
        r.kind==='place' ? '📍' : `<span style="display:inline-flex;vertical-align:middle;">${iconHTML(r.icon,16)}</span>`
      } ${fEsc(r.name)}</div>
      <span class="sr-dist">${formatDist(r.dist)}</span>
      ${(addMode && r.kind!=='route') ? `<button class="ml-btn" style="background:#ff9f1c;border-color:#ff9f1c;color:#000;font-weight:700;" onclick="addSearchResult(${i})">＋</button>` : ''}
    </div>`).join('');

const REACH=40;
function toggleNav(){navActive?stopNav():startNav();}
function startNav(){
  if(!points.length){alert(t('alert_no_points'));return;}

    document.getElementById('nav-dist-next').textContent=t('dist_straight',{dist:formatDist(d)});
    const roadRem=calcRemainingDist();
    const totalRem = roadRem!==null ? d+roadRem : d;
    document.getElementById('nav-dist-goal').textContent=t('dist_remaining',{dist:formatDist(totalRem)});
  }

function stopNav(){
  navActive=false;
  const btn=document.getElementById('btn-nav');btn.textContent=t('nav_start_btn');btn.className='btn btn-green';
  document.getElementById('nav-bar').classList.remove('show');

function updateNavBar(){
  if(!navActive||!points.length)return;
  const p=points[navIndex],next=points[navIndex+1];
  document.getElementById('nav-label').textContent=`${navIndex+1} / ${points.length}`;
  document.getElementById('nav-name').textContent=p.name||t('nav_point_default',{n:navIndex+1});
  document.getElementById('nav-memo-txt').textContent=p.memo||'';
  document.getElementById('nav-sub').textContent=next?t('nav_next_label',{name:next.name||t('nav_point_default',{n:navIndex+2})}):t('nav_goal_label');
  // 距離は毎秒GPS更新で更新するので空欄のみ初期化
  document.getElementById('nav-dist-next').textContent='';
  document.getElementById('nav-dist-goal').textContent='';
}
function checkProgress(lat,lng){
  if(!navActive||navIndex>=points.length)return;
  const tgt=points[navIndex];
  if(calcDist(lat,lng,tgt.lat,tgt.lng)<REACH){
    speak(t('point_reached_speak',{name:tgt.name||t('nav_point_default',{n:navIndex+1})}));
    navIndex++;
    if(navIndex>=points.length){speak(t('goal_reached_speak'));stopNav();alert(t('goal_reached_alert'));return;}
    refreshAllMarkers();renderList();updateNavBar();
    const next=points[navIndex];
    speak(t('next_point_speak',{name:next.name||t('nav_point_default',{n:navIndex+1}),memo:next.memo||''}));
  }
}
function calcDist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let _cachedVoices = [];
function _refreshVoices(){ _cachedVoices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  _refreshVoices();
  speechSynthesis.onvoiceschanged = _refreshVoices;
}
function _findVoiceForLocale(locale){
  if(!_cachedVoices.length) _refreshVoices();
  const exact = _cachedVoices.find(v => v.lang.toLowerCase() === locale.toLowerCase());
  if(exact) return exact;
  const prefix = locale.split('-')[0].toLowerCase();
  return _cachedVoices.find(v => v.lang.toLowerCase().startsWith(prefix)) || null;
}
function speak(txt){
  if(!('speechSynthesis'in window))return;
  const locale = SPEECH_LOCALE[currentLang]||'en-US';
  const voice = _findVoiceForLocale(locale);
  if(!voice){ console.warn('この言語に対応した音声が端末に見つかりません:', locale); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.voice = voice;
  u.lang = voice.lang;
  u.rate=0.95;
  speechSynthesis.speak(u);
}

// ルートポイント → 保存用データ（名前・メモ・アイコン・固定ポイントIDを全部記録）
function pointToSnapshot(p){
  const d = {lat:p.lat, lng:p.lng, name:p.name||'', memo:p.memo||''};
  if(p.icon) d.icon = p.icon;
  if(p.fixedPointId) d.fixedPointId = p.fixedPointId;
  if(p.segMode) d.segMode = p.segMode;
  if(p.segColor) d.segColor = p.segColor;
  if(p.segPath && p.segPath.length>1) d.segPath = p.segPath;
  return d;
}
// 保存用データ → ルートポイント（中身は保存時のまま。固定ポイント本体が残っていれば紐付けだけ復活）
function snapshotToPoint(d, i){
  const p = {id:Date.now()+i, lat:d.lat, lng:d.lng, name:d.name||'', memo:d.memo||'', marker:null};
  if(d.icon) p.icon = d.icon;
  if(d.segMode) p.segMode = d.segMode;
  if(d.segColor) p.segColor = d.segColor;
  if(d.segPath) p.segPath = d.segPath;
  if(d.fixedPointId && savedPoints.some(sp=>sp.id===d.fixedPointId)) p.fixedPointId = d.fixedPointId;
  return p;
}
function saveRoute(){
  if(!points.length){alert(t('alert_no_points'));return;}
  const data={version:3,points:points.map(pointToSnapshot)};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`route-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function loadRoute(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        clearAll(true);
        data.points.forEach((d,i)=>{
          const p=snapshotToPoint(d,i);
          addMarker(p,i);points.push(p);
        });
        updatePolyline();renderList();
        if(points.length)map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
      }catch{alert(t('alert_load_fail'));}
    };
    reader.readAsText(e.target.files[0]);
  };input.click();
}
function clearAll(silent=false){
  if(!silent&&points.length&&!confirm(t('confirm_clear_all')))return;
  points.forEach(p=>{if(p.marker)map.removeLayer(p.marker);});
  points=[];clearPolylines();
  if(navActive)stopNav();
  renderList();
}

let editPopupId = null;

function openEditPopup(id, anchorEl){
  editPopupId = id;

  if(!p) return;

  const popup = document.getElementById('edit-popup');
  document.getElementById('edit-popup-title').textContent = t('point_label',{n:points.indexOf(p)+1});
  document.getElementById('edit-popup-name').value = p.name||'';
  document.getElementById('edit-popup-memo').value = p.memo||'';

  // 位置決め：anchorElがあればその近く、なければ画面中央下
  if(anchorEl){
    const rect = anchorEl.getBoundingClientRect();
    const popW = 240;
    let left = rect.left + rect.width/2 - popW/2;
    let top = rect.bottom + 8;
    // 画面からはみ出し補正
    left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
    if(top + 160 > window.innerHeight) top = rect.top - 168;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  } else {
    popup.style.left = '50%';
    popup.style.top = '60%';
    popup.style.transform = 'translateX(-50%)';
  }

  popup.classList.add('show');
  setTimeout(()=>document.getElementById('edit-popup-name').focus(), 100);

  // 地図をそのポイントに移動（追従は一時停止）
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  map.panTo([p.lat, p.lng]);

  // 欄をそのポイントにスクロール
  const idx = points.indexOf(p);
  setTimeout(()=>{
    const rows = document.querySelectorAll('.point-row');
    if(rows[idx]){
      rows[idx].scrollIntoView({behavior:'smooth', block:'nearest'});

      const pw = document.getElementById('points-wrap');
      if(pw && window.innerWidth>=900){
        const row = rows[idx];
        pw.scrollLeft = row.offsetLeft - pw.clientWidth/2 + row.clientWidth/2;
      }
    }
  }, 50);
}

// 変換本体：saved_pointsに保存し、同じ順番の位置に固定ポイントとして入れ直す
async function convertRoutePointToFixed(routePointId, name, memo, icon, fpMeta){
  fpMeta = fpMeta || {};
  const idx = points.findIndex(x=>x.id===routePointId);
  if(idx === -1) return true;
  const p = points[idx];
  try{
    const newId = crypto.randomUUID();
    const res = await supabaseFetch('/rest/v1/saved_points', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        id: newId,
        user_id: currentUser.id,
        name, memo, icon, ...fpMeta,
        lat: p.lat, lng: p.lng
      })
    });
    if(res.ok){
      const newSavedPoint = { id:newId, user_id:currentUser.id, name, memo, icon, ...fpMeta, lat:p.lat, lng:p.lng };
      addSavedPointMarker(newSavedPoint);
      if(p.marker) map.removeLayer(p.marker);
      points.splice(idx, 1);
      const savedInsertAfterIndex = insertAfterIndex;
      insertAfterIndex = idx - 1;
      addFixedPointToRoute(newSavedPoint);
      insertAfterIndex = savedInsertAfterIndex;
      return true;
    } else {
      alert(t('alert_save_fail',{err: await res.text()}));
      return false;
    }
  }catch(e){
    alert(t('err_network'));
    return false;
  }
}

// ===== 距離表示 =====
let distUnit = 'km'; // 'km' or 'mi'
let segmentDistances = []; // ポイント間の道路距離(m)

function toggleDistUnit(){
  distUnit = distUnit==='km' ? 'mi' : 'km';
  document.getElementById('dist-unit-btn').textContent = distUnit;
  updateNavBar();
  renderList();
}

function formatDist(meters){
  if(distUnit==='km'){
    return meters < 1000
      ? Math.round(meters) + 'm'
      : (meters/1000).toFixed(1) + 'km';
  } else {
    const miles = meters / 1609.34;
    return miles < 0.1
      ? Math.round(meters*3.281) + 'ft'
      : miles.toFixed(1) + 'mi';
  }
}

// OSRMレスポンスからセグメント距離を抽出して保存
function storeSegmentDistances(osrmData){
  if(!osrmData || !osrmData.routes || !osrmData.routes[0]) return;
  const legs = osrmData.routes[0].legs;
  segmentDistances = legs.map(l=>l.distance);
}

// 残り距離を計算（navIndex以降のセグメント合計）
function calcRemainingDist(){
  if(!segmentDistances.length) return null;
  let total = 0;
  for(let i=navIndex; i<segmentDistances.length; i++){
    total += segmentDistances[i];
  }
  return total;
}

async function authSubmit(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display='none';

  if(!email || !password){ errEl.textContent=t('err_email_password_required'); errEl.style.display='block'; return; }
  if(password.length < 6){ errEl.textContent=t('err_password_min'); errEl.style.display='block'; return; }
  if(currentAuthTab==='signup'){
    const uname = document.getElementById('auth-username').value.trim();
    if(!uname){ errEl.textContent=t('err_username_required'); errEl.style.display='block'; return; }
    if(!/^[a-zA-Z0-9_]+$/.test(uname)){ errEl.textContent=t('err_username_format'); errEl.style.display='block'; return; }
  }

  const btn = document.getElementById('auth-submit-btn');
  btn.textContent = '...'; btn.disabled = true;

  try {
    const redirectTo = window.location.origin + window.location.pathname;
    const endpoint = currentAuthTab==='login'
      ? '/auth/v1/token?grant_type=password'
      : '/auth/v1/signup?redirect_to=' + encodeURIComponent(redirectTo);
    const res = await fetch(SUPABASE_URL + endpoint, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(data.error || data.error_code){
      errEl.textContent = data.error_description || data.msg || t('err_network');
      errEl.style.display='block';
      return;
    }

    currentUser = data.user;
    authToken = data.access_token;
    refreshToken = data.refresh_token;
    localStorage.setItem('navi_session', JSON.stringify(data));

    // サインアップ時はprofileを作成（エラーハンドリング追加）
    if(currentAuthTab === 'signup'){
      const username = document.getElementById('auth-username').value.trim();
      if(username){
        const profileRes = await supabaseFetch('/rest/v1/profiles', {
          method: 'POST',
          prefer: 'return=minimal',
          body: JSON.stringify({ id: currentUser.id, username })
        });
        if(!profileRes.ok){
          const err = await profileRes.json();
          errEl.textContent = err.message?.includes('unique') ? t('err_username_taken') : t('err_username_save_fail');
          errEl.style.display='block';
          // プロフィール作成失敗なので認証状態をリセット
          currentUser = null;
          authToken = null;
          localStorage.removeItem('navi_session');
          return;
        }
      }
    }

    // プロフィールを取得してusernameをcurrentUserに追加
    await loadUserProfile();
    updateUserBar();
    loadSavedPoints();
    closeAuthScreen();
    const mineTab = document.getElementById('tab-mine');
    if(mineTab) mineTab.style.display='';
    const pointsTab = document.getElementById('tab-points');
    if(pointsTab) pointsTab.style.display='';
  } catch(e){
    errEl.textContent = t('err_network');
    errEl.style.display='block';
  } finally {
    btn.textContent = currentAuthTab==='login'?t('login_tab'):t('signup_tab');
    btn.disabled = false;
  }
}

  const params = new URLSearchParams(hash.substring(1));

function isFixedPointLinked(fpId){
  return points.some(p => p.fixedPointId === fpId);
}

// ルートに組み込まれている間、独立した⭐マーカーは非表示にする（合成マーカーと二重に見えないように）
function refreshSavedPointVisibility(){
  savedPoints.forEach((p, i) => {
    const marker = savedPointMarkers[i];
    if(!marker) return;
    const show = !isFixedPointLinked(p.id) && !isPointGroupHidden(p.group_id);
    if(!show && map.hasLayer(marker)) map.removeLayer(marker);
    else if(show && !map.hasLayer(marker)) marker.addTo(map);
  });
}

function determineFixedInsertPosition(){
  if(insertAfterIndex!==null){
    return insertAfterIndex===-1?0:insertAfterIndex+1;
  }
  return points.length;
}

// ===== Supabase ルート保存・読込 =====
async function refreshAuthToken(){
  if(!refreshToken){
    // リフレッシュ用の情報を持たない古いセッション（自動更新不能）。
    // 無効なセッションを破棄してログインし直してもらう。
    forceReLogin();
    return false;
  }
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if(!res.ok){ forceReLogin(); return false; }
    const data = await res.json();
    if(!data.access_token){ forceReLogin(); return false; }
    authToken = data.access_token;
    refreshToken = data.refresh_token || refreshToken;
    if(data.user) currentUser = { ...currentUser, ...data.user, username: currentUser?.username };
    localStorage.setItem('navi_session', JSON.stringify({ ...data, user: currentUser }));
    return true;
  }catch(e){
    forceReLogin();
    return false;
  }
}

// セッションが自動更新不能な場合、破棄してログイン画面に誘導する
function forceReLogin(){
  currentUser = null;
  authToken = null;
  refreshToken = null;
  localStorage.removeItem('navi_session');
  clearSavedPointMarkers();
  updateUserBar();
  showAuthScreen();
}

async function supabaseFetch(path, options={}, _retried=false){
  const headers = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
  };
  if(options.prefer) headers['Prefer'] = options.prefer;
  if(authToken){
    headers['Authorization'] = 'Bearer ' + authToken;
  } else {
    headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  }
  const res = await fetch(SUPABASE_URL + path, {
    method: options.method || 'GET',
    headers,
    body: options.body
  });
  // JWT期限切れ（401 or PGRST303）なら1回だけ自動更新して再試行
  if((res.status === 401 || res.status === 403) && authToken && !_retried){
    const refreshed = await refreshAuthToken();
    if(refreshed){
      return supabaseFetch(path, options, true);
    }
  }
  return res;
}

// 自分か親のどれかが「非表示」なら非表示
function isPointGroupHidden(gid){
  let cur = gid, guard = 0;
  while(cur && guard++ < 100){
    const g = findGroup('point', cur);
    if(!g) return false;
    if(g.is_hidden) return true;
    cur = g.parent_group_id;
  }
  return false;
}

// フォルダを「親→子」の順に並べ、深さ付きで返す（excludeId とその子孫は除く）
function flattenGroups(kind, excludeId){
  const out = [];
  const walk = (parentId, depth) => {
    groupsOf(kind).filter(g=>(g.parent_group_id||null)===parentId)
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''))
      .forEach(g=>{
        if(g.id===excludeId) return;
        out.push({g, depth});
        walk(g.id, depth+1);
      });
  };
  walk(null, 0);
  return out;
}

function descendantGroupIds(kind, id){
  const out = [];
  const walk = pid => groupsOf(kind).filter(g=>g.parent_group_id===pid).forEach(g=>{ out.push(g.id); walk(g.id); });
  walk(id);
  return out;
}

function groupOptionsHTML(kind, selectedId, excludeId){
  let html = `<option value="">${fEsc(t('group_root'))}</option>`;
  flattenGroups(kind, excludeId).forEach(({g, depth})=>{
    html += `<option value="${g.id}"${g.id===selectedId?' selected':''}>${'　'.repeat(depth)}📁 ${fEsc(g.name)}</option>`;
  });
  return html;
}

function fillGroupSelect(sel, kind, selectedId){
  if(selectedId && !findGroup(kind, selectedId)) selectedId = null;
  sel.innerHTML = groupOptionsHTML(kind, selectedId, null);
}

function fillVisibilitySelect(sel, value){

}

  const validGroup = id => id && findGroup(kind, id);
  let html = '';
  const walk = (parentId, depth) => {
    groupsOf(kind).filter(g=>(g.parent_group_id && validGroup(g.parent_group_id) ? g.parent_group_id : null)===parentId)
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''))
      .forEach(g=>{

      });

      .forEach(it=>{ html += itemRowHTML(kind, it, depth); });

  el.innerHTML = html || `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${t('no_routes')}</div>`;

// データベースを書き換えて、成功したら一覧を読み直す
async function mlWrite(path, options){
  try{
    const res = await supabaseFetch(path, { prefer:'return=minimal', ...options });
    if(!res.ok){ alert(t('alert_save_fail',{err: await res.text()})); return false; }
    return true;
  }catch(e){
    alert(t('err_network'));
    return false;
  }
}

async function afterMlChange(){
  const kind = mlKind();
  if(kind==='point'){ await loadSavedPoints(); }
  await loadRouteListTab(currentTab);
}

async function createGroup(parentId){
  const kind = mlKind();
  const name = (prompt(t('new_folder_prompt')) || '').trim();
  if(!name) return;
  const parent = parentId ? findGroup(kind, parentId) : null;
  const ok = await mlWrite(`/rest/v1/${groupTable(kind)}`, {
    method:'POST',
    body: JSON.stringify({ id: crypto.randomUUID(), user_id: currentUser.id, name, parent_group_id: parentId || null,
      visibility: parent ? (parent.visibility||'private') : 'private' })
  });
  if(ok){ if(parentId) expandedGroups.add(parentId); await afterMlChange(); }
}

async function renameGroup(kind, id){
  const g = findGroup(kind, id); if(!g) return;
  const name = (prompt(t('rename_prompt'), g.name) || '').trim();
  if(!name || name===g.name) return;
  if(await mlWrite(`/rest/v1/${groupTable(kind)}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ name }) })) await afterMlChange();
}

async function moveGroup(kind, id, parentId){
  if(await mlWrite(`/rest/v1/${groupTable(kind)}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ parent_group_id: parentId || null }) })){
    if(parentId) expandedGroups.add(parentId);
    await afterMlChange();
  }
}

// フォルダを消しても中身は消さず、1つ上に移す
async function deleteGroup(kind, id){
  const g = findGroup(kind, id); if(!g) return;
  if(!confirm(t('confirm_delete_folder'))) return;
  const parent = g.parent_group_id || null;
  const body1 = JSON.stringify({ parent_group_id: parent });
  const body2 = JSON.stringify({ group_id: parent });
  const ok = await mlWrite(`/rest/v1/${groupTable(kind)}?parent_group_id=eq.${id}`, { method:'PATCH', body: body1 })
    && await mlWrite(`/rest/v1/${itemTable(kind)}?group_id=eq.${id}&user_id=eq.${currentUser.id}`, { method:'PATCH', body: body2 })
    && await mlWrite(`/rest/v1/${groupTable(kind)}?id=eq.${id}`, { method:'DELETE' });
  mlActionKey = null;
  if(ok) await afterMlChange(); else await afterMlChange();
}

async function setGroupVisibility(kind, id, v){
  let ok = await mlWrite(`/rest/v1/${groupTable(kind)}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ visibility: v }) });
  if(ok && confirm(t('confirm_apply_children'))){
    const ids = [id, ...descendantGroupIds(kind, id)];
    const sub = ids.slice(1);
    if(sub.length) ok = await mlWrite(`/rest/v1/${groupTable(kind)}?id=in.(${sub.join(',')})`, { method:'PATCH', body: JSON.stringify({ visibility: v }) });
    if(ok) await mlWrite(`/rest/v1/${itemTable(kind)}?group_id=in.(${ids.join(',')})&user_id=eq.${currentUser.id}`,
      { method:'PATCH', body: JSON.stringify({ visibility: v, is_public: v==='public' }) });
  }
  await afterMlChange();
}

async function setItemVisibility(kind, id, v){
  if(await mlWrite(`/rest/v1/${itemTable(kind)}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ visibility: v, is_public: v==='public' }) })) await afterMlChange();
}

async function moveItem(kind, id, groupId){
  if(await mlWrite(`/rest/v1/${itemTable(kind)}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ group_id: groupId || null }) })){

function buildShareLink(kindParam, id){

}

async function copyShareLink(kindParam, id, visibility){
  const url = buildShareLink(kindParam, id);
  try{
    await navigator.clipboard.writeText(url);
    alert(t('link_copied') + '\n' + url + (visibility==='private' ? '\n\n' + t('link_private_warn') : ''));
  }catch(e){
    prompt(t('link_copied'), url);
  }

// リンクで開かれた時：中身を読み込んでプレビュー表示
async function openSharedLink(){
  const q = new URLSearchParams(location.search);
  const pairs = [['r','route','item'],['p','point','item'],['rg','route','group'],['pg','point','group']];
  for(const [param, kind, type] of pairs){
    const id = q.get(param);
    if(!id) continue;
    try{
      if(type==='item'){
        const path = kind==='route'
          ? `/rest/v1/routes?id=eq.${id}&select=id,user_id,name,points,visibility,group_id,like_count,created_at`
          : `/rest/v1/saved_points?id=eq.${id}`;
        const res = await supabaseFetch(path);
        const data = res.ok ? await res.json() : [];
        if(!data.length){ alert(t('link_not_visible')); return; }
        const it = data[0];
        await cacheUsernames([it.user_id]);
        evKind = kind; evUserId = it.user_id; evData = { groups:[], items:[it] };
        startPreview({ kind, type:'item', ownerId:it.user_id, title:it.name, icon:it.icon, visibility:it.visibility, groups:[], items:[it] });
      } else {
        const gt = kind==='route' ? 'route_groups' : 'point_groups';
        const res = await supabaseFetch(`/rest/v1/${gt}?id=eq.${id}`);
        const data = res.ok ? await res.json() : [];
        if(!data.length){ alert(t('link_not_visible')); return; }
        const owner = data[0].user_id;
        await cacheUsernames([owner]);
        evKind = kind;
        await openEvUser(owner);
        closeRouteList();
        if(!evFindGroup(id)){ alert(t('link_not_visible')); return; }
        previewEvGroup(id);
      }
    }catch(e){
      alert(t('link_not_visible'));
    }
    return;
  }
}

async function cacheUsernames(ids){
  const need = [...new Set(ids)].filter(id=>id && !usernameCache[id]);
  if(!need.length) return;
  try{
    const res = await supabaseFetch(`/rest/v1/profiles?select=id,username,avatar_url&id=in.(${need.join(',')})`);
    if(res.ok) (await res.json()).forEach(p=>{ usernameCache[p.id]=p.username; if(p.avatar_url) avatarCache[p.id]=p.avatar_url; });
  }catch(e){}
}

let avatarCache = {}; // ユーザーID → 画像URL

function userAvatarHTML(uid, size){

// 画像を正方形に収めて縮小する。色が変わらないようPNG（可逆）で書き出す
async function processImage(file, size){
  // 小さい画像はそのまま使う（変換しないので、色も透過も元のまま）
  if(file.size <= 400*1024) return file;
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const scale = Math.min(size / bitmap.width, size / bitmap.height);
  const w = bitmap.width * scale, h = bitmap.height * scale;
  ctx.drawImage(bitmap, (size-w)/2, (size-h)/2, w, h); // 背景は塗らない＝透過のまま
  const blob = await new Promise(r=>canvas.toBlob(r, 'image/png'));
  return blob || file;
}

function blobToDataURL(blob){
  return new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(blob); });
}

function refreshIconPreviews(){
  const gp = document.getElementById('gps-icon-preview');
  if(gp) gp.innerHTML = gpsIconData ? `<img src="${gpsIconData}" style="width:100%;height:100%;object-fit:contain;">` : '🔵';
  const ap = document.getElementById('avatar-preview');
  if(ap) ap.innerHTML = (currentUser && avatarCache[currentUser.id])
    ? `<img src="${avatarCache[currentUser.id]}" style="width:100%;height:100%;object-fit:cover;">` : '👤';
}

async function onGpsIconPicked(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    const blob = await processImage(file, 128);
    gpsIconData = await blobToDataURL(blob);
    localStorage.setItem('navi_gps_icon', gpsIconData);
    rebuildGpsMarker();
    refreshIconPreviews();
  }catch(e){ alert(t('icon_upload_fail')); }
}

function resetGpsIcon(){
  gpsIconData = null;
  localStorage.removeItem('navi_gps_icon');
  rebuildGpsMarker();
  refreshIconPreviews();
}

async function onAvatarPicked(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!currentUser){ showAuthScreen(); return; }
  try{
    const blob = await processImage(file, 256);
    const type = blob.type || 'image/png';
    const ext = type.includes('png') ? 'png' : type.includes('webp') ? 'webp' : type.includes('gif') ? 'gif' : 'jpg';
    const path = `${currentUser.id}/avatar.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/avatars/${path}`, {
      method:'POST',
      headers:{ 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (authToken || SUPABASE_KEY), 'x-upsert':'true', 'Content-Type': type },
      body: blob
    });
    if(!res.ok) throw new Error(await res.text());
    const url = `${SUPABASE_URL}/storage/v1/object/public/avatars/${path}?t=${Date.now()}`;
    const r2 = await supabaseFetch(`/rest/v1/profiles?id=eq.${currentUser.id}`, {
      method:'PATCH', prefer:'return=minimal', body: JSON.stringify({ avatar_url: url })
    });
    if(!r2.ok) throw new Error(await r2.text());
    avatarCache[currentUser.id] = url;
    refreshIconPreviews();
    updateUserBar();
  }catch(e){
    console.error(e);
    alert(t('icon_upload_fail'));
  }
}

async function resetAvatar(){
  if(!currentUser) return;
  try{
    await supabaseFetch(`/rest/v1/profiles?id=eq.${currentUser.id}`, {
      method:'PATCH', prefer:'return=minimal', body: JSON.stringify({ avatar_url: null })
    });
    delete avatarCache[currentUser.id];
    refreshIconPreviews();
    updateUserBar();
  }catch(e){ alert(t('icon_upload_fail')); }
}

function evFindGroup(id){ return evData.groups.find(g=>g.id===id) || null; }

// 見えているフォルダの親を返す（親が見えていなければ一番上扱い）
function evParentOf(g){ return (g.parent_group_id && evFindGroup(g.parent_group_id)) ? g.parent_group_id : null; }
function evGroupOfItem(it){ return (it.group_id && evFindGroup(it.group_id)) ? it.group_id : null; }

function renderEveryoneTree(){
  const el = document.getElementById('route-list-items');
  let html = `<div class="ml-row"><button class="ml-btn" onclick="evBack()">${t('ev_back')}</button>
    <div class="ml-name" style="display:flex;align-items:center;gap:6px;">${userAvatarHTML(evUserId,22)}<span style="overflow:hidden;text-overflow:ellipsis;">${fEsc(usernameCache[evUserId]||'—')} · ${evKind==='route'?t('tab_routes'):t('tab_points')}</span></div></div>`;
  const walk = (parentId, depth) => {
    evData.groups.filter(g=>evParentOf(g)===parentId).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(g=>{
      const open = evExpanded.has(g.id);
      html += `<div class="ml-row" style="padding-left:${depth*16+4}px;">
        <button class="ml-toggle" onclick="evToggle('${g.id}')">${open?'▼':'▶'}</button>
        <div class="ml-name" onclick="previewEvGroup('${g.id}')">📁 ${fEsc(g.name)}</div>
        <span class="ml-vis" title="${fEsc(visLabel(g.visibility))}">${visIcon(g.visibility)}</span>
      </div>`;
      if(open) walk(g.id, depth+1);
    });
    evData.items.filter(it=>evGroupOfItem(it)===parentId).forEach(it=>{
      const label = evKind==='route'
        ? `🛣 ${fEsc(it.name)} <span class="ml-sub">· ${t('points_count',{n:(it.points||[]).length})}</span>`
        : `<span style="display:inline-flex;vertical-align:middle;">${iconHTML(it.icon,18)}</span> ${fEsc(it.name||'—')}`;
      html += `<div class="ml-row" style="padding-left:${depth*16+26}px;">
        <div class="ml-name" onclick="previewEvItem('${it.id}')">${label}</div>
        <span class="ml-vis" title="${fEsc(visLabel(it.visibility))}">${visIcon(it.visibility)}</span>
        ${likeBtnHTML(evKind, it.id, it.like_count)}
      </div>`;
    });
  };
  walk(null, 0);
  if(!evData.groups.length && !evData.items.length){
    html += `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${t('no_routes')}</div>`;
  }
  el.innerHTML = html;
}

function evToggle(id){ if(evExpanded.has(id)) evExpanded.delete(id); else evExpanded.add(id); renderEveryoneTree(); }

// フォルダとその子孫（見えているもの）を「親→子」の順に
function evSubtreeGroups(rootId){
  const out = [];
  const g0 = evFindGroup(rootId); if(!g0) return out;
  out.push(g0);
  const walk = pid => evData.groups.filter(g=>g.parent_group_id===pid).forEach(g=>{ out.push(g); walk(g.id); });
  walk(rootId);
  return out;
}

function makePreviewPin(n, icon){

}

// 全部入る大きさで、全ポイントの中心に一番近いポイントを中心にする
function fitPointsAroundCenter(latlngs){
  if(!latlngs.length) return;
  if(latlngs.length===1){ map.setView(latlngs[0], Math.max(map.getZoom(),16)); return; }
  const b = L.latLngBounds(latlngs);
  const c = b.getCenter();
  let best = latlngs[0], bestD = Infinity;
  latlngs.forEach(ll=>{ const d = calcDist(c.lat,c.lng,ll[0],ll[1]); if(d<bestD){ bestD=d; best=ll; } });
  let dLat = 0, dLng = 0;
  latlngs.forEach(ll=>{ dLat=Math.max(dLat,Math.abs(ll[0]-best[0])); dLng=Math.max(dLng,Math.abs(ll[1]-best[1])); });
  map.fitBounds([[best[0]-dLat,best[1]-dLng],[best[0]+dLat,best[1]+dLng]], {padding:[50,50]});
}

async function drawPreviewRoute(route){
  const pts = (route.points||[]);
  pts.forEach((d,i)=>{
    L.marker([d.lat,d.lng],{icon:makePreviewPin(i+1,d.icon)}).bindPopup(pointPopupHTML(d.name,d.memo)).addTo(previewLayer);
  });
  if(pts.length<2) return;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const mode = a.segMode || 'car';
    if(a.segPath && a.segPath.length>1){
      L.polyline(a.segPath, {color:'#45c7ff', weight:5, opacity:0.85,
        dashArray:(mode==='train'||mode==='plane')?'12,8':null}).addTo(previewLayer);
      continue;
    }
    const straight = segIsStraight(mode);
    const tmp = L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
      {color:'#45c7ff', weight: straight?4:3, opacity: straight?0.85:0.5,
       dashArray: (mode==='train'||mode==='plane') ? '12,8' : '6,6'}).addTo(previewLayer);
    if(straight) continue;
    try{
      const r = await fetchSegmentGeometry(a,b,mode);
      if(previewLayer && previewLayer.hasLayer(tmp)){
        previewLayer.removeLayer(tmp);
        L.geoJSON(r.geometry,{style:{color:'#45c7ff',weight:5,opacity:0.85}}).addTo(previewLayer);
      }
    }catch(e){ /* 直線のまま */ }
  }
}

async function startPreview(state){
  previewState = state;
