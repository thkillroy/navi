<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マイナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#0d0d0d; color:#fff; font-family:'Helvetica Neue',Arial,sans-serif; height:100dvh; overflow:hidden; display:flex; flex-direction:column; }

#map-wrap { position:relative; flex:1; min-height:0; }
#map { width:100%; height:100%; }

#gps-badge { position:absolute; top:8px; left:8px; z-index:1000; background:rgba(0,0,0,0.75); border-radius:20px; padding:5px 10px; font-size:11px; color:#666; pointer-events:none; }
#gps-badge.good { color:#44cc44; }
#gps-badge.bad { color:#cc4444; }

#follow-btn { position:absolute; bottom:12px; right:12px; z-index:1000; width:44px; height:44px; border-radius:50%; border:2px solid #444; background:rgba(0,0,0,0.8); color:#888; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#follow-btn.active { background:#f0a500; color:#000; border-color:#f0a500; }

#bottom { background:#111; border-top:2px solid #f0a500; flex-shrink:0; display:flex; flex-direction:column; }

#nav-bar { background:#000; padding:10px 14px 8px; border-bottom:2px solid #333; flex-shrink:0; display:none; }
#nav-bar.show { display:block; }
#nav-label { font-size:11px; color:#666; letter-spacing:0.1em; margin-bottom:2px; }
#nav-name { font-size:20px; font-weight:700; color:#f0a500; line-height:1.2; }
#nav-memo-txt { font-size:12px; color:#aaa; margin-top:2px; }
#nav-sub { font-size:11px; color:#555; margin-top:4px; }

#controls { padding:8px 10px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid #222; flex-shrink:0; }
#search-row { display:flex; gap:6px; }
#search-input { flex:1; background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#fff; padding:8px 10px; font-size:13px; outline:none; }
#search-input:focus { border-color:#f0a500; }
#search-input::placeholder { color:#444; }
#btn-row { display:flex; gap:6px; flex-wrap:wrap; }

.btn { padding:8px 12px; border:none; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.btn-orange { background:#f0a500; color:#000; }
.btn-orange:hover { background:#ffb820; }
.btn-gray { background:#222; color:#aaa; border:1px solid #333; }
.btn-gray:hover { background:#2a2a2a; color:#ddd; }
.btn-red { background:#2a0000; color:#ff6666; border:1px solid #500; }
.btn-green { background:#003a00; color:#66ff66; border:1px solid #050; }
.btn-nav-stop { background:#cc0000; color:#fff; }
.btn-add-active { background:#ff4400; color:#fff; }
.btn-insert-active { background:#0066cc; color:#fff; }
.btn-route-active { background:#0044cc; color:#fff; }

/* ポイントリスト */
#points-wrap { overflow-y:auto; -webkit-overflow-scrolling:touch; max-height:220px; }
#points-wrap::-webkit-scrollbar { width:3px; }
#points-wrap::-webkit-scrollbar-thumb { background:#333; }

.point-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid #1a1a1a; transition:all 0.2s; }
.point-row.current-row { padding:14px 12px; background:#1a1200; border-left:3px solid #f0a500; border-bottom:1px solid #333; }
.point-row.done-row { opacity:0.3; }

/* 挿入ボタン行 */
.insert-row { display:flex; align-items:center; justify-content:center; padding:2px 12px; }
.insert-btn { background:#0d0d0d; border:1px dashed #333; color:#444; font-size:14px; font-weight:700; cursor:pointer; border-radius:4px; padding:2px 16px; width:100%; transition:all 0.15s; }
.insert-btn:hover, .insert-btn.active { background:#001a33; border-color:#0066cc; color:#0099ff; }

.point-num { width:26px; height:26px; border-radius:50%; background:#222; border:2px solid #f0a500; color:#f0a500; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.point-row.current-row .point-num { width:36px; height:36px; font-size:15px; background:#f0a500; color:#000; border-color:#f0a500; }
.point-num.done { border-color:#444; color:#444; background:#111; }

.point-info { flex:1; min-width:0; cursor:pointer; }
.point-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ccc; }
.point-row.current-row .point-name { font-size:16px; color:#f0a500; }
.point-memo-label { font-size:10px; color:#f0a500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.point-row.current-row .point-memo-label { font-size:12px; }

.point-del { background:#2a0000; border:1px solid #500; color:#ff6666; font-size:16px; font-weight:700; cursor:pointer; padding:6px 12px; border-radius:6px; flex-shrink:0; min-width:44px; min-height:36px; display:flex; align-items:center; justify-content:center; }
.point-del:active { background:#4a0000; }

.empty-msg { text-align:center; padding:20px 16px; color:#444; font-size:12px; line-height:2; }

/* インライン編集ポップアップ */
#edit-popup {
  display:none;
  position:fixed;
  z-index:8000;
  background:#1a1a1a;
  border:1px solid #f0a500;
  border-radius:10px;
  padding:12px 14px;
  width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,0.6);
}
#edit-popup.show { display:block; }
#edit-popup label { font-size:10px; color:#555; display:block; margin-bottom:3px; letter-spacing:0.1em; text-transform:uppercase; }
#edit-popup input, #edit-popup textarea {
  width:100%; background:#0d0d0d; border:1px solid #333;
  border-radius:6px; color:#fff; padding:7px 10px;
  font-size:13px; outline:none; margin-bottom:8px; font-family:inherit;
}
#edit-popup input:focus, #edit-popup textarea:focus { border-color:#f0a500; }
#edit-popup textarea { resize:none; height:52px; }
#edit-popup-title { font-size:11px; color:#f0a500; font-weight:700; margin-bottom:10px; }

/* モーダル */
#modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; align-items:flex-end; justify-content:center; }
#modal-overlay.show { display:flex; }
#modal { background:#1a1a1a; border-radius:16px 16px 0 0; padding:20px 18px 36px; width:100%; max-width:500px; border-top:1px solid #333; }
#modal h3 { font-size:14px; color:#f0a500; margin-bottom:14px; }
#modal label { font-size:10px; color:#555; display:block; margin-bottom:4px; letter-spacing:0.1em; text-transform:uppercase; }
#modal input, #modal textarea, #modal select { width:100%; background:#0d0d0d; border:1px solid #333; border-radius:8px; color:#fff; padding:10px 12px; font-size:14px; outline:none; margin-bottom:12px; font-family:inherit; }
#modal input:focus, #modal textarea:focus, #modal select:focus { border-color:#f0a500; }
#modal textarea { resize:none; height:60px; }
#modal select option { background:#1a1a1a; }
#modal-btns { display:flex; gap:8px; }
#modal-btns .btn { flex:1; padding:12px; font-size:14px; }
#position-row { display:none; }

/* スマホ横向き */
@media (orientation:landscape) and (max-width:900px) {
  body { flex-direction:row; }
  #map-wrap { flex:1; height:100dvh; }
  #bottom { width:200px; height:100dvh; border-top:none; border-left:2px solid #f0a500; overflow-y:auto; }
  #points-wrap { max-height:none; flex:1; }
  #nav-name { font-size:14px; }
  .point-row.current-row .point-name { font-size:13px; }
}

/* PC */
@media (min-width:900px) {
  #nav-name { font-size:18px; }
  #controls { flex-direction:row; align-items:center; padding:8px 16px; gap:8px; }
  #search-row { flex:1; }
  #btn-row { flex-shrink:0; flex-wrap:nowrap; }
  #points-wrap { max-height:none; height:160px; display:flex; flex-direction:row; overflow-x:auto; overflow-y:hidden; border-top:1px solid #222; align-items:stretch; }
  #points-wrap::-webkit-scrollbar { height:3px; }
  .point-row { flex-direction:column; align-items:flex-start; min-width:160px; max-width:160px; border-bottom:none; border-right:1px solid #1a1a1a; padding:10px 12px; gap:4px; }
  .point-row.current-row { min-width:200px; max-width:200px; padding:14px 12px; border-left:none; border-top:3px solid #f0a500; }
  .point-name { white-space:normal; font-size:11px; }
  .insert-row { flex-direction:column; min-width:32px; max-width:32px; padding:8px 4px; border-right:1px solid #1a1a1a; }
  .insert-btn { writing-mode:vertical-rl; padding:8px 2px; font-size:12px; width:auto; height:100%; }
  .empty-msg { min-width:300px; }
}
</style>
</head>
<body>

<div id="map-wrap">
  <div id="map"></div>
  <div id="gps-badge">📡 GPS待機中</div>
  <button id="follow-btn" onclick="toggleFollow()">🧭</button>
</div>

<div id="user-bar-wrap" style="flex-shrink:0;"></div>
<div id="bottom">
  <div id="nav-bar">
    <div id="nav-label">次のポイントへ</div>
    <div id="nav-name">—</div>
    <div id="nav-memo-txt"></div>
    <div id="nav-sub"></div>
    <div id="nav-dist" style="font-size:16px;color:#ccc;margin-top:6px;display:flex;gap:16px;align-items:center;">
      <span id="nav-dist-next" style="color:#aaa;"></span>
      <span id="nav-dist-goal" style="color:#fff;font-weight:600;"></span>
      <button onclick="toggleDistUnit()" style="background:#222;border:1px solid #444;color:#aaa;font-size:13px;padding:3px 10px;border-radius:4px;cursor:pointer;" id="dist-unit-btn">km</button>
    </div>
  </div>
  <div id="controls">
    <div id="search-row">
      <input type="text" id="search-input" placeholder="🔍 住所・場所を検索">
      <button class="btn btn-orange" onclick="searchAddress()">検索</button>
    </div>
    <div id="btn-row">
      <button class="btn btn-gray" id="btn-add" onclick="toggleAddMode()">＋ タップ追加</button>
      <button class="btn btn-gray" id="btn-route-mode" onclick="toggleRouteMode()">🛣 道路</button>
      <button class="btn btn-green" id="btn-nav" onclick="toggleNav()">▶ ナビ開始</button>
      <button class="btn btn-gray" onclick="reverseRoute()">🔄 復路</button>
      <button class="btn btn-gray" onclick="showSaveDialog()">💾 保存</button>
      <button class="btn btn-gray" onclick="showRouteList()">📂 ルート一覧</button>
      <button class="btn btn-gray" id="btn-auth" onclick="handleAuthBtn()" style="background:#1a3a1a;border-color:#0a5a0a;color:#66cc66;">👤 ログイン</button>
      <button class="btn btn-red" onclick="clearAll()">🗑</button>
    </div>
  </div>
  <div id="points-scroll-wrap" style="position:relative;display:flex;align-items:stretch;">
    <button id="scroll-left" onclick="scrollPoints(-1)" style="display:none;background:#222;border:none;color:#f0a500;font-size:20px;padding:0 10px;cursor:pointer;flex-shrink:0;z-index:10;">&#9664;</button>
    <div id="points-wrap" style="flex:1;min-width:0;">
      <div class="empty-msg">ポイントがありません<br>住所検索かタップで追加</div>
    </div>
    <button id="scroll-right" onclick="scrollPoints(1)" style="display:none;background:#222;border:none;color:#f0a500;font-size:20px;padding:0 10px;cursor:pointer;flex-shrink:0;z-index:10;">&#9654;</button>
  </div>
</div>

<!-- ユーザー名設定ダイアログ -->
<div id="username-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99998;align-items:center;justify-content:center;">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;width:320px;max-width:90vw;">
    <h3 style="font-size:14px;color:#f0a500;margin-bottom:16px;">ユーザー名を設定</h3>
    <label style="font-size:11px;color:#555;display:block;margin-bottom:5px;">ユーザー名（英数字とアンダーバー）</label>
    <input type="text" id="new-username" placeholder="例: kilroy_driver"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:6px;font-family:inherit;">
    <div id="username-error" style="font-size:12px;color:#ff6666;margin-bottom:12px;display:none;"></div>
    <div style="display:flex;gap:8px;">
      <button onclick="document.getElementById('username-dialog').style.display='none'"
        style="flex:1;padding:10px;background:#222;border:1px solid #333;color:#aaa;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">キャンセル</button>
      <button onclick="saveUsername()"
        style="flex:1;padding:10px;background:#f0a500;border:none;color:#000;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">保存</button>
    </div>
    <button onclick="confirmLogout()"
      style="width:100%;padding:8px;background:none;border:none;color:#555;font-size:12px;cursor:pointer;margin-top:8px;">ログアウト</button>
  </div>
</div>

<!-- ログイン/サインアップ画面 -->
<div id="auth-screen" style="display:none;position:fixed;inset:0;background:#0d0d0d;z-index:99999;align-items:center;justify-content:center;flex-direction:column;">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:28px;width:340px;max-width:90vw;">
    <h2 style="font-size:18px;color:#f0a500;margin-bottom:6px;text-align:center;">🗺 マイナビ</h2>
    <p style="font-size:12px;color:#555;text-align:center;margin-bottom:20px;">ルートを保存するにはログインが必要です</p>
    
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button onclick="authTab('login')" id="auth-tab-login" 
        style="flex:1;padding:8px;background:#f0a500;border:none;color:#000;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;">ログイン</button>
      <button onclick="authTab('signup')" id="auth-tab-signup"
        style="flex:1;padding:8px;background:#222;border:1px solid #333;color:#aaa;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;">新規登録</button>
    </div>

    <div id="username-row" style="display:none;">
      <label style="font-size:11px;color:#555;display:block;margin-bottom:4px;">ユーザー名</label>
      <input type="text" id="auth-username" placeholder="例: kilroy_driver（英数字とアンダーバー）"
        style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;">
    </div>
    <label style="font-size:11px;color:#555;display:block;margin-bottom:4px;">メールアドレス</label>
    <input type="email" id="auth-email" placeholder="example@email.com"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;">
    
    <label style="font-size:11px;color:#555;display:block;margin-bottom:4px;">パスワード</label>
    <input type="password" id="auth-password" placeholder="6文字以上"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:16px;font-family:inherit;">

    <div id="auth-error" style="font-size:12px;color:#ff6666;margin-bottom:12px;display:none;"></div>

    <button onclick="authSubmit()" id="auth-submit-btn"
      style="width:100%;padding:12px;background:#f0a500;border:none;color:#000;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">ログイン</button>
    
    <button onclick="closeAuthScreen()"
      style="width:100%;padding:10px;background:none;border:none;color:#555;font-size:12px;cursor:pointer;margin-top:8px;">ログインせずに使う</button>
  </div>
</div>

<!-- ユーザー情報バー（非表示） -->
<div id="user-bar" style="display:none;">
  <span id="user-email-display"></span>
</div>

<!-- 保存ダイアログ -->
<div id="save-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;width:320px;max-width:90vw;">
    <h3 style="font-size:14px;color:#f0a500;margin-bottom:16px;">ルートを保存</h3>
    <label style="font-size:11px;color:#555;display:block;margin-bottom:5px;">ルート名</label>
    <input type="text" id="save-route-name" placeholder="例: 月曜ルート、○○配送コース"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <input type="checkbox" id="save-is-public" style="width:18px;height:18px;cursor:pointer;">
      <label for="save-is-public" style="font-size:13px;color:#aaa;cursor:pointer;">公開する（他のユーザーも見られる）</label>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeSaveDialog()" style="flex:1;padding:10px;background:#222;border:1px solid #333;color:#aaa;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">キャンセル</button>
      <button onclick="saveToSupabase()" style="flex:1;padding:10px;background:#f0a500;border:none;color:#000;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">保存</button>
    </div>
  </div>
</div>

<!-- ルート一覧 -->
<div id="route-list-dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;width:360px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-size:14px;color:#f0a500;">保存済みルート</h3>
      <button onclick="closeRouteList()" style="background:none;border:none;color:#666;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button onclick="loadRouteListTab('mine')" id="tab-mine" style="flex:1;padding:7px;background:#f0a500;border:none;color:#000;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">自分のルート</button>
      <button onclick="loadRouteListTab('public')" id="tab-public" style="flex:1;padding:7px;background:#222;border:1px solid #333;color:#aaa;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">公開ルート</button>
    </div>
    <div id="route-list-items" style="overflow-y:auto;flex:1;">
      <div style="text-align:center;padding:20px;color:#555;font-size:12px;">読み込み中...</div>
    </div>
  </div>
</div>

<!-- インライン編集ポップアップ -->
<div id="edit-popup">
  <div id="edit-popup-title"></div>
  <label>ポイント名</label>
  <input type="text" id="edit-popup-name" placeholder="名前（省略OK）">
  <label>メモ</label>
  <textarea id="edit-popup-memo" placeholder="曲がり方向など"></textarea>
</div>

<!-- モーダル -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <label>ポイント名（省略OK）</label>
    <input type="text" id="modal-name" placeholder="例: ○○工場、△△倉庫">
    <label>メモ（曲がり方向など）</label>
    <textarea id="modal-memo-input" placeholder="例: 右折して200m先&#10;門の前で停車"></textarea>
    <div id="position-row">
      <label id="position-label">挿入位置</label>
      <select id="modal-position"></select>
    </div>
    <div id="modal-btns">
      <button class="btn btn-gray" onclick="cancelModal()">キャンセル</button>
      <button class="btn btn-orange" id="modal-ok" onclick="confirmModal()">追加</button>
    </div>
  </div>
</div>

<script>
const MAPTILER_KEY = 'RXZt95T89eK6jTrAs2kn';
const SUPABASE_URL = 'https://zryfljpzllnkukbitfpl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyeWZsanB6bGxua3VrYml0ZnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTI4NDcsImV4cCI6MjEwNTM4ODg0N30.RySxqFIiVBvwuwujMjODTkrxD3AJWD26yhqJsEojhMI';
const map = L.map('map', { center:[35.68,139.75], zoom:14, zoomControl:false });
L.tileLayer(`https://api.maptiler.com/maps/jp-gsi-standard/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
  attribution:'© <a href="https://www.maptiler.com/">MapTiler</a> © OpenStreetMap',
  maxZoom:19, tileSize:256
}).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);

let points=[], polylines=[], addMode=false;
let navActive=false, navIndex=0;
let followMode=false, gpsMarker=null, gpsCircle=null, gpsInitialized=false;
let pendingLatLng=null, editingId=null, insertAfterIndex=null;
let useRoad=true;

// ===== 起動時に現在地へ =====
function startGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(onGPS, onGPSErr, {enableHighAccuracy:true, maximumAge:2000, timeout:10000});
}
function onGPS(pos){
  const{latitude:lat, longitude:lng, accuracy}=pos.coords;
  const b=document.getElementById('gps-badge');
  b.textContent=`📡 精度 ±${Math.round(accuracy)}m`;
  b.className=accuracy<30?'good':accuracy<100?'':'bad';
  // 初回だけ現在地に移動
  if(!gpsInitialized){ map.setView([lat,lng],16); gpsInitialized=true; }
  if(!gpsMarker){
    gpsMarker=L.circleMarker([lat,lng],{radius:9,color:'#00aaff',fillColor:'#00aaff',fillOpacity:1,weight:3}).addTo(map);
    gpsCircle=L.circle([lat,lng],{radius:accuracy,color:'#00aaff',fillColor:'#00aaff',fillOpacity:0.08,weight:1}).addTo(map);
  }else{ gpsMarker.setLatLng([lat,lng]); gpsCircle.setLatLng([lat,lng]).setRadius(accuracy); }
  if(followMode)map.panTo([lat,lng]);
  if(navActive){
    checkProgress(lat,lng);
    // ナビバーの距離をリアルタイム更新
    if(navIndex<points.length){
      const t=points[navIndex];
      const d=calcDist(lat,lng,t.lat,t.lng);
      document.getElementById('nav-dist-next').textContent=`次P直線: ${formatDist(d)}`;
      // 残り = 現在地→次のポイント(直線) + 次のポイント→ゴール(道路)
      const roadRem=calcRemainingDist(); // 次のポイント以降の道路距離
      const totalRem = roadRem!==null ? d+roadRem : d;
      document.getElementById('nav-dist-goal').textContent=`残り: ${formatDist(totalRem)}`;
    }
  }
}
function onGPSErr(){ const b=document.getElementById('gps-badge'); b.textContent='📡 GPS失敗'; b.className='bad'; }

function toggleFollow(){
  if(!followMode){
    // followModeがOFF → 現在地に移動してON
    followMode=true;
    document.getElementById('follow-btn').classList.add('active');
    if(gpsMarker) map.panTo(gpsMarker.getLatLng());
  } else {
    // followModeがON → 現在地にポイント追加（followModeはONのまま）
    if(gpsMarker){
      const ll=gpsMarker.getLatLng();
      openModal({lat:ll.lat,lng:ll.lng},null,null);
    }
  }
}
map.on('dragstart',()=>{ followMode=false; document.getElementById('follow-btn').classList.remove('active'); document.getElementById('follow-btn').title=''; });

// ===== 地図タップ =====
map.on('click', e=>{
  if(!addMode)return;
  openModal(e.latlng, null, null); // null=挿入位置未指定（モーダルで選ぶ）
});

// ===== 追加モード =====
function toggleAddMode(){
  addMode=!addMode;
  const btn=document.getElementById('btn-add');
  if(addMode){ btn.textContent='✕ 追加終了'; btn.className='btn btn-add-active'; }
  else{ btn.textContent='＋ タップ追加'; btn.className='btn btn-gray'; insertAfterIndex=null; }
}

// ===== 欄の挿入ボタン =====
// afterIdx: この番号の「後」に挿入。-1なら先頭の前（0番目として挿入）
function startInsertAt(afterIdx){
  insertAfterIndex=afterIdx;
  addMode=true;
  // afterIdx=-1なら先頭(1番目)、afterIdx=0なら2番目、afterIdx=3なら5番目
  const insertPos=afterIdx+2;
  const displayPos=afterIdx===-1?1:insertPos;
  const btn=document.getElementById('btn-add');
  btn.textContent=`✕ ${displayPos}番目に挿入中`;
  btn.className='btn btn-insert-active';
  document.querySelectorAll('.insert-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.after)===afterIdx);
  });
}

// ===== モーダル =====
function openModal(latlng, id, forceInsertAfter){
  pendingLatLng=latlng;
  editingId=id;
  const isEdit=id!==null;
  document.getElementById('modal-title').textContent=isEdit?'ポイントを編集':'ポイントを追加';
  document.getElementById('modal-ok').textContent=isEdit?'保存':'追加';
  if(isEdit){
    const p=points.find(x=>x.id===id);
    document.getElementById('modal-name').value=p.name;
    document.getElementById('modal-memo-input').value=p.memo;
    document.getElementById('position-row').style.display='none';
  } else {
    document.getElementById('modal-name').value='';
    document.getElementById('modal-memo-input').value='';
    // 位置選択：ポイントが2つ以上 かつ 欄の+から来ていない場合のみ表示
    const posRow=document.getElementById('position-row');
    const sel=document.getElementById('modal-position');
    if(points.length>=2 && insertAfterIndex===null){
      // 地図タップ時のみ：位置を選ばせる
      posRow.style.display='block';
      document.getElementById('position-label').textContent=`挿入位置（デフォルト: ${points.length+1}番目）`;
      sel.innerHTML='';
      // 末尾
      const optEnd=document.createElement('option');
      optEnd.value=points.length;
      optEnd.textContent=`${points.length+1}番目（末尾）`;
      optEnd.selected=true;
      sel.appendChild(optEnd);
      // 2番目〜N番目（挿入）
      for(let i=1;i<points.length;i++){
        const opt=document.createElement('option');
        opt.value=i;
        opt.textContent=`${i+1}番目（${i}と${i+1}の間）`;
        sel.appendChild(opt);
      }
    } else if(points.length>=2 && insertAfterIndex!==null){
      // 欄の+から来た場合：位置を表示するが変更不可（確認用）
      const insertPos=insertAfterIndex===-1?0:insertAfterIndex+1;
      const displayPos=insertPos+1;
      posRow.style.display='block';
      document.getElementById('position-label').textContent=`挿入位置`;
      sel.innerHTML=`<option value="${insertPos}" selected>${displayPos}番目に挿入</option>`;
    } else {
      posRow.style.display='none';
    }
  }
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('modal-ok').focus(),100);
}

function cancelModal(){
  document.getElementById('modal-overlay').classList.remove('show');
  pendingLatLng=null; editingId=null; insertAfterIndex=null;
  document.querySelectorAll('.insert-btn').forEach(b=>b.classList.remove('active'));
  // addModeは継続（キャンセルしても追加モードは維持）
  if(addMode){
    const btn=document.getElementById('btn-add');
    btn.textContent='✕ 追加終了'; btn.className='btn btn-add-active';
  }
}

function confirmModal(){
  const name=document.getElementById('modal-name').value.trim();
  const memo=document.getElementById('modal-memo-input').value.trim();

  if(editingId!==null){
    const p=points.find(x=>x.id===editingId);
    p.name=name; p.memo=memo;
    refreshAllMarkers(); renderList();
  } else {
    if(!pendingLatLng)return;
    const p={id:Date.now(), lat:pendingLatLng.lat, lng:pendingLatLng.lng, name, memo, marker:null};

    // 挿入位置を決定
    let insertAt;
    if(insertAfterIndex!==null){
      // 欄の＋ボタンから（afterIdx=-1なら先頭、afterIdx=Nならその次）
      insertAt=insertAfterIndex===-1?0:insertAfterIndex+1;
    } else if(points.length>=2 && document.getElementById('position-row').style.display!=='none'){
      // 地図タップ＋位置選択
      insertAt=parseInt(document.getElementById('modal-position').value);
    } else {
      // 末尾
      insertAt=points.length;
    }

    // 挿入
    points.splice(insertAt,0,p);
    // 全マーカー再描画
    rebuildAllMarkers();
    updatePolyline();
    renderList();
  }

  document.getElementById('modal-overlay').classList.remove('show');
  const wasInsert=insertAfterIndex!==null;
  pendingLatLng=null; editingId=null; insertAfterIndex=null;
  // addModeは常に継続（連続追加可能）
  // 挿入ボタンのハイライトだけ解除
  insertAfterIndex=null;
  document.querySelectorAll('.insert-btn').forEach(b=>b.classList.remove('active'));
  if(addMode){
    const btn=document.getElementById('btn-add');
    btn.textContent='✕ 追加終了'; btn.className='btn btn-add-active';
  }
}

document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)confirmModal();});

// ===== マーカー =====
function makeIcon(idx,state){
  const c=state==='cur'?['#00aaff','#fff']:state==='done'?['#555','#888']:['#f0a500','#000'];
  const n=idx+1,fs=n>=100?9:n>=10?11:14;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
    <path d="M17 0C7.6 0 0 7.6 0 17c0 11 17 27 17 27s17-16 17-27C34 7.6 26.4 0 17 0z" fill="${c[0]}" opacity="${state==='done'?0.4:1}"/>
    <circle cx="17" cy="17" r="11" fill="#fff" opacity="0.95"/>
    <text x="17" y="${17+fs*0.4}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="${c[0]}">${n}</text>
  </svg>`;
  return L.divIcon({html:svg,iconSize:[34,44],iconAnchor:[17,44],className:''});
}

function getState(idx){
  if(!navActive)return'normal';
  if(idx<navIndex)return'done';
  if(idx===navIndex)return'cur';
  return'normal';
}

function addMarker(p,idx){
  const m=L.marker([p.lat,p.lng],{icon:makeIcon(idx,getState(idx)),draggable:true}).addTo(map);
  m.bindTooltip(makeTooltip(p,idx),{direction:'top',offset:[0,-40]});
  m.on('click',function(e){ L.DomEvent.stopPropagation(e); _openEditFromMarker(p.id); });
  m.on('dragend',e=>{p.lat=e.target.getLatLng().lat;p.lng=e.target.getLatLng().lng;updatePolyline();});
  p.marker=m;
}

function makeTooltip(p,idx){
  return `<b>${idx+1}${p.name?' - '+p.name:''}</b>${p.memo?'<br><span style="color:#f0a500">'+p.memo+'</span>':''}`;
}

// 全マーカーを削除して再生成（挿入時に番号を正しく振り直す）
function rebuildAllMarkers(){
  points.forEach(p=>{if(p.marker){map.removeLayer(p.marker);p.marker=null;}});
  points.forEach((p,i)=>addMarker(p,i));
}

function refreshAllMarkers(){
  points.forEach((p,i)=>{
    if(!p.marker)return;
    p.marker.setIcon(makeIcon(i,getState(i)));
    p.marker.setTooltipContent(makeTooltip(p,i));
  });
}

// ===== ポリライン =====
function clearPolylines(){ polylines.forEach(l=>map.removeLayer(l)); polylines=[]; }

async function updatePolyline(){
  clearPolylines();
  if(points.length<2)return;
  if(!useRoad){
    const line=L.polyline(points.map(p=>[p.lat,p.lng]),{color:'#f0a500',weight:4,opacity:0.85}).addTo(map);
    polylines.push(line);
    return;
  }
  const tmp=L.polyline(points.map(p=>[p.lat,p.lng]),{color:'#f0a500',weight:3,opacity:0.3,dashArray:'6,6'}).addTo(map);
  polylines.push(tmp);
  try{
    const coords=points.map(p=>p.lng+','+p.lat).join(';');
    const res=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&continue_straight=true');
    const data=await res.json();
    if(data.code!=='Ok'||!data.routes.length)return;
    map.removeLayer(tmp); polylines=polylines.filter(l=>l!==tmp);
    const line=L.geoJSON(data.routes[0].geometry,{style:{color:'#f0a500',weight:5,opacity:0.85}}).addTo(map);
    polylines.push(line);
    storeSegmentDistances(data);
    renderList(); // 距離を反映
  }catch(e){console.warn('OSRM失敗',e);}
}

function toggleRouteMode(){
  useRoad=!useRoad;
  const btn=document.getElementById('btn-route-mode');
  if(useRoad){btn.textContent='🛣 道路';btn.className='btn btn-gray';}
  else{btn.textContent='📏 直線';btn.className='btn btn-route-active';}
  updatePolyline();
}

// ===== ポイントリスト =====
function renderList(){
  const el=document.getElementById('points-wrap');
  if(!points.length){el.innerHTML='<div class="empty-msg">ポイントがありません<br>住所検索かタップで追加</div>';return;}

  let html='';
  points.forEach((p,i)=>{
    const state=getState(i);
    const rowClass=state==='cur'?'current-row':state==='done'?'done-row':'';
    const numClass=state==='done'?'done':'';
    const displayName=p.name||'';

    // 先頭の前に挿入ボタン（ポイントが2つ以上の時のみ）
    if(i===0 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="-1" onclick="startInsertAt(-1)">＋</button></div>`;
    }

    const segDist = segmentDistances[i] != null ? formatDist(segmentDistances[i]) : '';
    html+=`<div class="point-row ${rowClass}">
      <div class="point-num ${numClass}" onclick="_suppressMapClick=true; openEditPopup(${p.id}, this)" style="cursor:pointer;">${i+1}</div>
      <div class="point-info" onclick="focusPoint(${p.id})">
        <div class="point-name">${displayName}</div>
        ${p.memo?`<div class="point-memo-label">📝 ${p.memo}</div>`:''}
        ${segDist?`<div style="font-size:13px;color:#888;margin-top:2px;">→ ${segDist}</div>`:''}
      </div>
      <button class="point-del" onclick="deletePoint(${p.id})">✕</button>
    </div>`;

    // ポイントとポイントの間に挿入ボタン（ポイントが2つ以上の時のみ）
    if(i<points.length-1 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="${i}" onclick="startInsertAt(${i})">＋</button></div>`;
    }
  });

  el.innerHTML=html;
  if(navActive){
    const rows=el.querySelectorAll('.point-row');
    if(rows[navIndex])rows[navIndex].scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  setTimeout(updateScrollBtns,50);
}

function focusPoint(id){
  const p=points.find(x=>x.id===id);
  if(!p)return;
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));
}

function deletePoint(id){
  const i=points.findIndex(x=>x.id===id);
  if(i===-1)return;
  map.removeLayer(points[i].marker);
  points.splice(i,1);
  if(navActive&&i<navIndex)navIndex--;
  if(navActive&&navIndex>=points.length)navIndex=Math.max(0,points.length-1);
  if(points.length===0)clearPolylines();
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  if(navActive)updateNavBar();
}

// ===== 住所検索 =====
async function searchAddress(){
  const q=document.getElementById('search-input').value.trim();if(!q)return;
  const btn=document.querySelector('#search-row .btn-orange');btn.textContent='...';btn.disabled=true;
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=ja&countrycodes=jp`);
    const data=await res.json();
    if(!data.length){alert('見つかりませんでした');return;}
    const{lat,lon,display_name}=data[0];
    map.setView([parseFloat(lat),parseFloat(lon)],17);
    document.getElementById('modal-name').value=display_name.split('、')[0].split(',')[0].trim();
    openModal({lat:parseFloat(lat),lng:parseFloat(lon)},null,points.length>=2?null:points.length);
    document.getElementById('search-input').value='';
  }catch{alert('検索失敗');}
  finally{btn.textContent='検索';btn.disabled=false;}
}
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')searchAddress();});

// ===== ナビ =====
const REACH=40;
function toggleNav(){navActive?stopNav():startNav();}
function startNav(){
  if(!points.length){alert('ポイントがありません');return;}
  navActive=true;navIndex=0;
  const btn=document.getElementById('btn-nav');btn.textContent='■ 停止';btn.className='btn btn-nav-stop';
  document.getElementById('nav-bar').classList.add('show');
  followMode=true;document.getElementById('follow-btn').classList.add('active');
  refreshAllMarkers();renderList();updateNavBar();
  const p=points[0];
  speak(`ナビ開始。最初は${p.name||'ポイント1'}。${p.memo||''}`);
  // 開始直後に距離を即表示（GPS更新を待たずに）
  if(gpsMarker){
    const ll=gpsMarker.getLatLng();
    const d=calcDist(ll.lat,ll.lng,p.lat,p.lng);
    document.getElementById('nav-dist-next').textContent=`直線: ${formatDist(d)}`;
    const roadRem=calcRemainingDist();
    const totalRem = roadRem!==null ? d+roadRem : d;
    document.getElementById('nav-dist-goal').textContent=`残り: ${formatDist(totalRem)}`;
  }
}
function stopNav(){
  navActive=false;
  const btn=document.getElementById('btn-nav');btn.textContent='▶ ナビ開始';btn.className='btn btn-green';
  document.getElementById('nav-bar').classList.remove('show');
  refreshAllMarkers();renderList();
}
function updateNavBar(){
  if(!navActive||!points.length)return;
  const p=points[navIndex],next=points[navIndex+1];
  document.getElementById('nav-label').textContent=`${navIndex+1} / ${points.length}`;
  document.getElementById('nav-name').textContent=p.name||`ポイント ${navIndex+1}`;
  document.getElementById('nav-memo-txt').textContent=p.memo||'';
  document.getElementById('nav-sub').textContent=next?`次: ${next.name||'ポイント'+(navIndex+2)}`:'🏁 ゴール';
  // 距離は毎秒GPS更新で更新するので空欄のみ初期化
  document.getElementById('nav-dist-next').textContent='';
  document.getElementById('nav-dist-goal').textContent='';
}
function checkProgress(lat,lng){
  if(!navActive||navIndex>=points.length)return;
  const t=points[navIndex];
  if(calcDist(lat,lng,t.lat,t.lng)<REACH){
    speak(`${t.name||'ポイント'+(navIndex+1)}、到達`);
    navIndex++;
    if(navIndex>=points.length){speak('ゴールです。お疲れ様でした。');stopNav();alert('🏁 ゴール！');return;}
    refreshAllMarkers();renderList();updateNavBar();
    const next=points[navIndex];
    speak(`次は${next.name||'ポイント'+(navIndex+1)}。${next.memo||''}`);
  }
}
function calcDist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.95;speechSynthesis.speak(u);}

// ===== 復路 =====
function reverseRoute(){
  if(points.length<2){alert('ポイントが2つ以上必要です');return;}
  if(!confirm('ポイントの順番を逆にして復路にしますか？'))return;
  points.reverse();
  if(navActive)navIndex=0;
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  if(navActive)updateNavBar();
}

// ===== 保存・読み込み =====
function saveRoute(){
  if(!points.length){alert('ポイントがありません');return;}
  const data={version:2,points:points.map(p=>({lat:p.lat,lng:p.lng,name:p.name,memo:p.memo}))};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`route-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function loadRoute(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        clearAll(true);
        data.points.forEach((d,i)=>{
          const p={id:Date.now()+i,lat:d.lat,lng:d.lng,name:d.name||'',memo:d.memo||'',marker:null};
          addMarker(p,i);points.push(p);
        });
        updatePolyline();renderList();
        if(points.length)map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
      }catch{alert('読み込み失敗');}
    };
    reader.readAsText(e.target.files[0]);
  };input.click();
}
function clearAll(silent=false){
  if(!silent&&points.length&&!confirm('全ポイントを削除しますか？'))return;
  points.forEach(p=>{if(p.marker)map.removeLayer(p.marker);});
  points=[];clearPolylines();
  if(navActive)stopNav();
  renderList();
}

// ===== マーカーからポップアップを開く =====
let _suppressMapClick = false;
function _openEditFromMarker(id){
  _suppressMapClick = true;
  openEditPopup(id, null);
}

// ===== インライン編集ポップアップ =====
let editPopupId = null;

function openEditPopup(id, anchorEl){
  editPopupId = id;
  const p = points.find(x=>x.id===id);
  if(!p) return;

  const popup = document.getElementById('edit-popup');
  document.getElementById('edit-popup-title').textContent = `ポイント ${points.indexOf(p)+1}`;
  document.getElementById('edit-popup-name').value = p.name||'';
  document.getElementById('edit-popup-memo').value = p.memo||'';

  // 位置決め：anchorElがあればその近く、なければ画面中央下
  if(anchorEl){
    const rect = anchorEl.getBoundingClientRect();
    const popW = 240;
    let left = rect.left + rect.width/2 - popW/2;
    let top = rect.bottom + 8;
    // 画面からはみ出し補正
    left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
    if(top + 160 > window.innerHeight) top = rect.top - 168;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  } else {
    popup.style.left = '50%';
    popup.style.top = '60%';
    popup.style.transform = 'translateX(-50%)';
  }

  popup.classList.add('show');
  setTimeout(()=>document.getElementById('edit-popup-name').focus(), 100);

  // 地図をそのポイントに移動（追従は一時停止）
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  map.panTo([p.lat, p.lng]);

  // 欄をそのポイントにスクロール
  const idx = points.indexOf(p);
  setTimeout(()=>{
    const rows = document.querySelectorAll('.point-row');
    if(rows[idx]){
      rows[idx].scrollIntoView({behavior:'smooth', block:'nearest'});
      // PCの横スクロールも対応
      const pw = document.getElementById('points-wrap');
      if(pw && window.innerWidth>=900){
        const row = rows[idx];
        pw.scrollLeft = row.offsetLeft - pw.clientWidth/2 + row.clientWidth/2;
      }
    }
  }, 50);
}

function closeEditPopup(){
  if(!editPopupId) return;
  const p = points.find(x=>x.id===editPopupId);
  if(p){
    p.name = document.getElementById('edit-popup-name').value.trim();
    p.memo = document.getElementById('edit-popup-memo').value.trim();
    refreshAllMarkers();
    renderList();

  document.getElementById('edit-popup').classList.remove('show');
  document.getElementById('edit-popup').style.transform = '';
  editPopupId = null;
}

// ===== 距離表示 =====
let distUnit = 'km'; // 'km' or 'mi'
let segmentDistances = []; // ポイント間の道路距離(m)

function toggleDistUnit(){
  distUnit = distUnit==='km' ? 'mi' : 'km';
  document.getElementById('dist-unit-btn').textContent = distUnit;
  updateNavBar();
  renderList();
}

function formatDist(meters){
  if(distUnit==='km'){
    return meters < 1000
      ? Math.round(meters) + 'm'
      : (meters/1000).toFixed(1) + 'km';
  } else {
    const miles = meters / 1609.34;
    return miles < 0.1
      ? Math.round(meters*3.281) + 'ft'
      : miles.toFixed(1) + 'mi';
  }
}

// OSRMレスポンスからセグメント距離を抽出して保存
function storeSegmentDistances(osrmData){
  if(!osrmData || !osrmData.routes || !osrmData.routes[0]) return;
  const legs = osrmData.routes[0].legs;
  segmentDistances = legs.map(l=>l.distance);
}

// 残り距離を計算（navIndex以降のセグメント合計）
function calcRemainingDist(){
  if(!segmentDistances.length) return null;
  let total = 0;
  for(let i=navIndex; i<segmentDistances.length; i++){
    total += segmentDistances[i];
  }
  return total;
}

// ===== Supabase Auth =====
let currentUser = null;
let authToken = null;
let currentAuthTab = 'login';

async function initAuth(){
  const session = localStorage.getItem('navi_session');
  if(session){
    try {
      const s = JSON.parse(session);
      // expires_atがない場合も含めて復元
      currentUser = s.user;
      authToken = s.access_token;
      await loadUserProfile();
      updateUserBar();
      return;
    } catch(e){}
    localStorage.removeItem('navi_session');
  }
}

function showAuthScreen(){
  document.getElementById('auth-screen').style.display='flex';
}

function closeAuthScreen(){
  document.getElementById('auth-screen').style.display='none';
}

function authTab(tab){
  currentAuthTab = tab;
  document.getElementById('auth-tab-login').style.background = tab==='login'?'#f0a500':'#222';
  document.getElementById('auth-tab-login').style.color = tab==='login'?'#000':'#aaa';
  document.getElementById('auth-tab-signup').style.background = tab==='signup'?'#f0a500':'#222';
  document.getElementById('auth-tab-signup').style.color = tab==='signup'?'#000':'#aaa';
  document.getElementById('auth-submit-btn').textContent = tab==='login'?'ログイン':'新規登録';
  document.getElementById('auth-error').style.display='none';
  document.getElementById('username-row').style.display = tab==='signup'?'block':'none';
}

async function authSubmit(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display='none';

  if(!email || !password){ errEl.textContent='メールとパスワードを入力してください'; errEl.style.display='block'; return; }
  if(password.length < 6){ errEl.textContent='パスワードは6文字以上'; errEl.style.display='block'; return; }
  if(currentAuthTab==='signup'){
    const uname = document.getElementById('auth-username').value.trim();
    if(!uname){ errEl.textContent='ユーザー名を入力してください'; errEl.style.display='block'; return; }
    if(!/^[a-zA-Z0-9_]+$/.test(uname)){ errEl.textContent='ユーザー名は英数字とアンダーバーのみ'; errEl.style.display='block'; return; }
  }

  const btn = document.getElementById('auth-submit-btn');
  btn.textContent = '...'; btn.disabled = true;

  try {
    const endpoint = currentAuthTab==='login' ? '/auth/v1/token?grant_type=password' : '/auth/v1/signup';
    const res = await fetch(SUPABASE_URL + endpoint, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(data.error || data.error_code){
      errEl.textContent = data.error_description || data.msg || 'エラーが発生しました';
      errEl.style.display='block';
      return;
    }

    currentUser = data.user;
    authToken = data.access_token;
    localStorage.setItem('navi_session', JSON.stringify(data));

    // サインアップ時はprofileを作成
    if(currentAuthTab === 'signup'){
      const username = document.getElementById('auth-username').value.trim();
      if(username){
        await supabaseFetch('/rest/v1/profiles', {
          method: 'POST',
          prefer: 'return=minimal',
          body: JSON.stringify({ id: currentUser.id, username })
        });
      }
    }

    // プロフィールを取得してusernameをcurrentUserに追加
    await loadUserProfile();
    updateUserBar();
    closeAuthScreen();
    const mineTab = document.getElementById('tab-mine');
    if(mineTab) mineTab.style.display='block';
  } catch(e){
    errEl.textContent = 'ネットワークエラー';
    errEl.style.display='block';
  } finally {
    btn.textContent = currentAuthTab==='login'?'ログイン':'新規登録';
    btn.disabled = false;
  }
}

function authLogout(){
  currentUser = null;
  authToken = null;
  localStorage.removeItem('navi_session');
  updateUserBar();
}

function updateUserBar(){
  const bar = document.getElementById('user-bar');
  const btn = document.getElementById('btn-auth');
  if(currentUser){
    if(bar) bar.style.display='flex';
    const emailEl = document.getElementById('user-email-display');
    if(emailEl) emailEl.textContent = '👤 ' + currentUser.email;
    if(btn){
      btn.textContent = '👤 ' + (currentUser.username || currentUser.email.split('@')[0]);
      btn.style.cssText = 'background:#1a2a3a;border:1px solid #2a4a6a;color:#66aaff;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;';
    }
  } else {
    if(bar) bar.style.display='none';
    if(btn){
      btn.textContent = '👤 ログイン';
      btn.style.cssText = 'background:#1a3a1a;border:1px solid #0a5a0a;color:#66cc66;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;';
    }
  }
}

function handleAuthBtn(){
  if(currentUser){
    const dialog = document.getElementById('username-dialog');
    const input = document.getElementById('new-username');
    input.value = currentUser.username || '';
    document.getElementById('username-error').style.display='none';
    dialog.style.display='flex';
    setTimeout(()=>input.focus(), 100);
  } else {
    showAuthScreen();
  }
}

function confirmLogout(){
  document.getElementById('username-dialog').style.display='none';
  if(confirm('ログアウトしますか？')) authLogout();
}

// ===== ユーザー名設定 =====
async function saveUsername(){
  const username = document.getElementById('new-username').value.trim();
  const errEl = document.getElementById('username-error');
  errEl.style.display='none';

  if(!username){ errEl.textContent='ユーザー名を入力してください'; errEl.style.display='block'; return; }
  if(!/^[a-zA-Z0-9_]+$/.test(username)){ errEl.textContent='英数字とアンダーバーのみ使用できます'; errEl.style.display='block'; return; }
  if(username.length < 3){ errEl.textContent='3文字以上入力してください'; errEl.style.display='block'; return; }

  try {
    // upsert（あれば更新、なければ挿入）
    const res = await supabaseFetch('/rest/v1/profiles', {
      method: 'POST',
      prefer: 'return=minimal,resolution=merge-duplicates',
      body: JSON.stringify({ id: currentUser.id, username })
    });
    if(res.ok || res.status===201 || res.status===204){
      currentUser.username = username;
      updateUserBar();
      document.getElementById('username-dialog').style.display='none';
    } else {
      const err = await res.json();
      errEl.textContent = err.message?.includes('unique') ? 'そのユーザー名は使われています' : '保存失敗';
      errEl.style.display='block';
    }
  } catch(e){
    errEl.textContent='ネットワークエラー';
    errEl.style.display='block';
  }
}

// ===== プロフィール =====
async function loadUserProfile(){
  if(!currentUser) return;
  try {
    const res = await supabaseFetch(`/rest/v1/profiles?id=eq.${currentUser.id}`);
    const data = await res.json();
    if(data && data[0]) currentUser.username = data[0].username;
  } catch(e){}
}

// ===== Supabase ルート保存・読込 =====
async function supabaseFetch(path, options={}){
  const headers = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
  };
  if(options.prefer) headers['Prefer'] = options.prefer;
  if(authToken){
    headers['Authorization'] = 'Bearer ' + authToken;
  } else {
    headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  }
  const res = await fetch(SUPABASE_URL + path, {
    method: options.method || 'GET',
    headers,
    body: options.body
  });
  return res;
}

function showSaveDialog(){
  if(!points.length){ alert('ポイントがありません'); return; }
  if(!currentUser){ showAuthScreen(); return; }
  document.getElementById('save-route-name').value = '';
  document.getElementById('save-is-public').checked = false;
  document.getElementById('save-dialog').style.display = 'flex';
  setTimeout(()=>document.getElementById('save-route-name').focus(), 100);
}

function closeSaveDialog(){
  document.getElementById('save-dialog').style.display = 'none';
}

async function saveToSupabase(){
  const name = document.getElementById('save-route-name').value.trim();
  if(!name){ alert('ルート名を入力してください'); return; }
  const isPublic = document.getElementById('save-is-public').checked;
  const data = {
    name,
    is_public: isPublic,
    user_id: currentUser.id,
    points: points.map(p=>({lat:p.lat, lng:p.lng, name:p.name, memo:p.memo}))
  };
  try {
    const res = await supabaseFetch('/rest/v1/routes', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify(data)
    });
    if(res.ok){
      closeSaveDialog();
      alert(`「${name}」を保存しました`);
    } else {
      const err = await res.json();
      alert('保存失敗: ' + JSON.stringify(err));
    }
  } catch(e){
    alert('保存失敗: ' + e.message);
  }
}

async function loadRouteListTab(tab){
  currentTab = tab;
  document.getElementById('tab-mine').style.background = tab==='mine' ? '#f0a500' : '#222';
  document.getElementById('tab-mine').style.color = tab==='mine' ? '#000' : '#aaa';
  document.getElementById('tab-public').style.background = tab==='public' ? '#f0a500' : '#222';
  document.getElementById('tab-public').style.color = tab==='public' ? '#000' : '#aaa';

  const el = document.getElementById('route-list-items');
  el.innerHTML = '<div style="text-align:center;padding:20px;color:#555;font-size:12px;">読み込み中...</div>';

  try {
    const filter = tab==='public' 
      ? '?is_public=eq.true&order=created_at.desc' 
      : `?user_id=eq.${currentUser?.id}&order=created_at.desc`;
    const res = await supabaseFetch('/rest/v1/routes' + filter);
    const data = await res.json();

    if(!data.length){
      el.innerHTML = '<div style="text-align:center;padding:20px;color:#555;font-size:12px;">ルートがありません</div>';
      return;
    }

    el.innerHTML = data.map(r=>`
      <div style="border-bottom:1px solid #222;padding:12px 4px;display:flex;align-items:center;gap:8px;">
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:600;color:#fff;">${r.name}</div>
          <div style="font-size:11px;color:#555;margin-top:2px;">
            ${r.points.length}ポイント
            ${r.is_public ? ' · 🌐 公開' : ' · 🔒 非公開'}

            · ${new Date(r.created_at).toLocaleDateString('ja-JP')}
          </div>
        </div>
        <button onclick="loadFromSupabase('${r.id}')" 
          style="padding:6px 12px;background:#f0a500;border:none;color:#000;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">読込</button>
        <button onclick="deleteFromSupabase('${r.id}')"
          style="padding:6px 10px;background:#2a0000;border:1px solid #500;color:#ff6666;border-radius:6px;font-size:12px;cursor:pointer;">🗑</button>
      </div>
    `).join('');
  } catch(e){
    el.innerHTML = '<div style="text-align:center;padding:20px;color:#c44;font-size:12px;">読み込み失敗</div>';
  }
}

async function loadFromSupabase(id){
  try {
    const res = await supabaseFetch(`/rest/v1/routes?id=eq.${id}`);
    const data = await res.json();
    if(!data.length){ alert('見つかりませんでした'); return; }
    const route = data[0];
    clearAll(true);
    route.points.forEach((d,i)=>{
      const p={id:Date.now()+i, lat:d.lat, lng:d.lng, name:d.name||'', memo:d.memo||'', marker:null};
      addMarker(p,i); points.push(p);
    });
    updatePolyline(); renderList();
    if(points.length) map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
    closeRouteList();
    alert(`「${route.name}」を読み込みました`);
  } catch(e){
    alert('読み込み失敗: ' + e.message);
  }
}

async function deleteFromSupabase(id){
  if(!confirm('このルートを削除しますか？')) return;
  try {
    const res = await supabaseFetch(`/rest/v1/routes?id=eq.${id}`, { method:'DELETE' });
    if(res.ok) loadRouteListTab(currentTab);
    else alert('削除失敗');
  } catch(e){
    alert('削除失敗: ' + e.message);
  }
}
