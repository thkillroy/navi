// ===== 同じ場所の重複チェック =====
const DUP_RADIUS_M = 30; // これより近ければ「同じ場所」とみなす

// 自分の固定ポイントの中から、同じ場所にあるものを探す
function findNearbyOwnPoint(lat, lng){
  let best = null, bestD = DUP_RADIUS_M;
  savedPoints.forEach(p=>{
    const d = calcDist(lat, lng, p.lat, p.lng);
    if(d <= bestD){ bestD = d; best = p; }
  });
  return best;
}

function dupChoice(title, bodyHTML, buttons){
  return new Promise(resolve=>{
    const dlg = document.getElementById('dup-dialog');
    document.getElementById('dup-title').textContent = title;
    document.getElementById('dup-body').innerHTML = bodyHTML;
    const box = document.getElementById('dup-buttons');
    box.innerHTML = '';
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.textContent = b.label;
      el.style.cssText = `padding:11px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid ${b.primary?'#ff9f1c':'#3a3a46'};background:${b.primary?'#ff9f1c':'#1c1c23'};color:${b.primary?'#000':'#ddd'};`;
      el.onclick = ()=>{ dlg.style.display='none'; resolve(b.value); };
      box.appendChild(el);
    });
    dlg.style.display = 'flex';
  });
}

function dupLine(label, p){
  return `<div style="padding:6px 0;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;color:#777;width:46px;flex-shrink:0;">${label}</span>
      <span style="display:inline-flex;">${iconHTML(p.icon,18)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${fEsc(p.name||'—')}</span>
    </div>
    <div style="margin-left:54px;font-size:12px;color:#9a9aa6;white-space:pre-wrap;word-break:break-word;max-height:80px;overflow-y:auto;">${p.memo ? fEsc(p.memo) : `<span style="color:#5e5e6b;">${t('dup_no_memo')}</span>`}</div>
  </div>`;
}

// 重複した分をどうするか決める。戻り値：元ID → 'new'（両方残す）/ 'overwrite'（上書き）/ 'keep'（自分のを残す）
async function resolveDuplicates(conflicts){
  if(!conflicts.length) return {};
  const out = {};
  const mode = await dupChoice(
    t('dup_title'),
    `<div style="margin-bottom:8px;">${t('dup_msg',{n:conflicts.length})}</div>` +
      conflicts.slice(0,2).map(c=>dupLine(t('dup_mine'), c.mine) + dupLine(t('dup_theirs'), c.src)).join('<hr style="border:none;border-top:1px solid #2b2b35;margin:6px 0;">') +
      (conflicts.length>2 ? `<div style="color:#777;font-size:11px;margin-top:6px;">…</div>` : ''),
    [
      { label: t('dup_overwrite_all'), value:'overwrite' },
      { label: t('dup_keep_all'), value:'keep' },
      { label: t('dup_one_by_one'), value:'each' },
      { label: t('cancel_btn'), value:'cancel' }
    ]
  );
  if(mode==='cancel') return null;
  if(mode!=='each'){ conflicts.forEach(c=>{ out[c.src.id] = mode; }); return out; }
  for(const c of conflicts){
    const v = await dupChoice(
      t('dup_title'),
      dupLine(t('dup_mine'), c.mine) + dupLine(t('dup_theirs'), c.src),
      [
        { label: t('dup_use_theirs'), value:'overwrite', primary:true },
        { label: t('dup_keep_mine'), value:'keep' },
        { label: t('dup_keep_both'), value:'new' },
        { label: t('cancel_btn'), value:'cancel' }
      ]
    );
    if(v==='cancel') return null;
    out[c.src.id] = v;
  }
  return out;
}

// 上書き：自分の固定ポイントの名前・メモ・アイコンを相手のもので置き換える
async function overwriteOwnPoint(mineId, src){
  const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${mineId}`, {
    method:'PATCH', prefer:'return=minimal',
    body: JSON.stringify({ name: src.name||'', memo: src.memo||'', icon: src.icon||'⭐', source_point_id: src.id })
  });
  if(!res.ok) throw new Error(await res.text());
}

// ===== 保存（コピーは必ず🔒非公開。元を記録して、2回目は足りない分だけ追加） =====
async function insertRows(table, rows){
  if(!rows.length) return;
  const res = await supabaseFetch(`/rest/v1/${table}`, { method:'POST', prefer:'return=minimal', body: JSON.stringify(rows) });
  if(!res.ok) throw new Error(await res.text());
}

// フォルダ構造をコピー。既に同じ元からコピー済みのフォルダは使い回す。戻り値：元ID → 自分のID
async function copyGroupTree(kind, srcGroups, destId){
  const map_ = {};
  const rows = [];
  const mine = groupsOf(kind);
  srcGroups.forEach((g, i)=>{
    const existing = mine.find(x=>x.source_group_id===g.id);
    if(existing){ map_[g.id] = existing.id; return; }
    const parent = i===0 ? (destId||null) : (map_[g.parent_group_id] || destId || null);
    const id = crypto.randomUUID();
    map_[g.id] = id;
    rows.push({ id, user_id: currentUser.id, name: g.name, parent_group_id: parent, visibility:'private', source_group_id: g.id });
  });
  await insertRows(groupTable(kind), rows);
  return map_;
}

async function savePreview(){
  if(!previewState) return;
  if(!currentUser){ showAuthScreen(); return; }
  const st = previewState;
  const btn = document.getElementById('pv-save-btn');
  btn.disabled = true;
  const destId = document.getElementById('pv-dest').value || null;
  if(st.kind==='route') lastRouteGroupId = destId; else lastPointGroupId = destId;
  let added = 0, skipped = 0, overwritten = 0;
  try{
    await loadGroups();
    const gmap = st.type==='group' ? await copyGroupTree(st.kind, st.groups, destId) : {};
    const groupFor = it => st.type==='group' ? (gmap[it.group_id] || destId) : destId;

    if(st.kind==='point'){
      const fresh = [], conflicts = [];
      st.items.forEach(p=>{
        if(savedPoints.some(x=>x.source_point_id===p.id)){ skipped++; return; }
        const near = findNearbyOwnPoint(p.lat, p.lng);
        if(near) conflicts.push({ src:p, mine:near });
        else fresh.push(p);
      });
      const decisions = await resolveDuplicates(conflicts);
      if(decisions===null){ btn.disabled=false; return; }
      const rows = fresh.map(p=>({ id: crypto.randomUUID(), user_id: currentUser.id, name: p.name, memo: p.memo, icon: p.icon||'⭐',
        lat: p.lat, lng: p.lng, group_id: groupFor(p), visibility:'private', is_public:false, source_point_id: p.id }));
      for(const c of conflicts){
        const d = decisions[c.src.id];
        if(d==='overwrite'){ await overwriteOwnPoint(c.mine.id, c.src); overwritten++; }
        else if(d==='keep'){ skipped++; }
        else rows.push({ id: crypto.randomUUID(), user_id: currentUser.id, name: c.src.name, memo: c.src.memo, icon: c.src.icon||'⭐',
          lat: c.src.lat, lng: c.src.lng, group_id: groupFor(c.src), visibility:'private', is_public:false, source_point_id: c.src.id });
      }
      await insertRows('saved_points', rows);
      added = rows.length;
    } else {
      const r0 = await supabaseFetch(`/rest/v1/routes?user_id=eq.${currentUser.id}&select=source_route_id`);
      const haveRoutes = new Set((r0.ok ? await r0.json() : []).map(x=>x.source_route_id).filter(Boolean));
      const includePts = document.getElementById('pv-include-row').style.display!=='none'
        && document.getElementById('pv-include-points').checked;
      // ルートの中の固定ポイント：元ID → 自分の固定ポイントID
      const fpMap = {};
      const fpRows = [];
      const targets = st.items.filter(r=>{ if(haveRoutes.has(r.id)){ skipped++; return false; } return true; });
      if(includePts){
        const cand = [], conflicts = [];
        targets.forEach(r=>(r.points||[]).forEach(d=>{
          if(!d.fixedPointId || fpMap[d.fixedPointId]) return;
          const existing = savedPoints.find(x=>x.source_point_id===d.fixedPointId || x.id===d.fixedPointId);
          if(existing){ fpMap[d.fixedPointId] = existing.id; return; }
          fpMap[d.fixedPointId] = null; // 一度見たという印
          const near = findNearbyOwnPoint(d.lat, d.lng);
          const src = { id:d.fixedPointId, name:d.name||'', memo:d.memo||'', icon:d.icon||'⭐', lat:d.lat, lng:d.lng };
          if(near) conflicts.push({ src, mine:near });
          else cand.push(src);
        }));
        const decisions = await resolveDuplicates(conflicts);
        if(decisions===null){ btn.disabled=false; return; }
        cand.forEach(src=>{
          const id = crypto.randomUUID();
          fpMap[src.id] = id;
          fpRows.push({ id, user_id: currentUser.id, name: src.name, memo: src.memo, icon: src.icon,
            lat: src.lat, lng: src.lng, group_id: null, visibility:'private', is_public:false, source_point_id: src.id });
        });
        for(const c of conflicts){
          const d = decisions[c.src.id];
          if(d==='overwrite'){ await overwriteOwnPoint(c.mine.id, c.src); overwritten++; fpMap[c.src.id] = c.mine.id; }
          else if(d==='keep'){ fpMap[c.src.id] = c.mine.id; }
          else {
            const id = crypto.randomUUID();
            fpMap[c.src.id] = id;
            fpRows.push({ id, user_id: currentUser.id, name: c.src.name, memo: c.src.memo, icon: c.src.icon,
              lat: c.src.lat, lng: c.src.lng, group_id: null, visibility:'private', is_public:false, source_point_id: c.src.id });
          }
        }
        await insertRows('saved_points', fpRows);
      }
      const rows = targets.map(r=>({
        user_id: currentUser.id, name: r.name, group_id: groupFor(r), visibility:'private', is_public:false, source_route_id: r.id,
        points: (r.points||[]).map(d=>{
          const c = { lat:d.lat, lng:d.lng, name:d.name||'', memo:d.memo||'' };
          if(d.icon) c.icon = d.icon;
          if(d.segMode) c.segMode = d.segMode;
          if(d.segColor) c.segColor = d.segColor;
          if(d.segPath) c.segPath = d.segPath;
          if(includePts && d.fixedPointId && fpMap[d.fixedPointId]) c.fixedPointId = fpMap[d.fixedPointId];
          return c;
        })
      }));
      await insertRows('routes', rows);
      added = rows.length;
    }
    await loadSavedPoints();
    alert(t('preview_result',{n:added, m:skipped}) + (overwritten ? ' ' + t('dup_result',{k:overwritten}) : ''));
    cancelPreview();
  }catch(e){
    alert(t('alert_save_fail',{err: e.message}));
  }finally{
    btn.disabled = false;
  }
}

async function loadFromSupabase(id){
  try {
    const res = await supabaseFetch(`/rest/v1/routes?id=eq.${id}`);
    const data = await res.json();
    if(!data.length){ alert(t('alert_route_notfound')); return; }
    const route = data[0];
    clearAll(true);
    route.points.forEach((d,i)=>{
      const p=snapshotToPoint(d,i);
      addMarker(p,i); points.push(p);
    });
    updatePolyline(); renderList();
    if(points.length) map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
    closeRouteList();
    alert(t('alert_load_success',{name:route.name}));
  } catch(e){
    alert(t('alert_load_route_fail',{err:e.message}));
  }
}

async function deleteFromSupabase(id){
  if(!confirm(t('confirm_delete_route'))) return;
  try {
    const res = await supabaseFetch(`/rest/v1/routes?id=eq.${id}`, { method:'DELETE' });
    if(res.ok) loadRouteListTab(currentTab);
    else alert(t('alert_delete_fail'));
  } catch(e){
    alert(t('alert_delete_fail')+': '+e.message);
  }
}

// 横向きパネルの表示切替（つまみをタップ、またはパネルを左右にスワイプ）
function togglePanelListOnly(){
  document.body.classList.toggle('panel-list-only');
  const on = document.body.classList.contains('panel-list-only');
  document.getElementById('panel-handle-text').textContent = on ? t('panel_show_buttons') : t('panel_list_only');
  if(window.map) setTimeout(()=>map.invalidateSize(), 150);
  if(typeof renderList==='function') renderList();
}
(function(){
  const panel = document.getElementById('bottom');
  let x0 = null, y0 = null;
  panel.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  panel.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    // 横に大きく、縦に小さく動いた時だけ切り替え（欄のスクロールとぶつからないように）
    if(Math.abs(dx) > 60 && Math.abs(dy) < 40) togglePanelListOnly();
  }, {passive:true});
})();

window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(window.map) map.invalidateSize(); }, 300); });
window.addEventListener('resize', ()=>{ if(window.map) map.invalidateSize(); });
initLangSelector();
applyStaticTranslations();
applyEditMode();
checkPasswordRecovery();
initAuth();
startGPS();
setTimeout(openSharedLink, 800);

// PWA（ホーム画面のアプリとして動かすための登録）
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW登録失敗', e));
  });
}
renderList();
setTimeout(updateScrollBtns,100);
