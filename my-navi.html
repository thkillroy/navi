<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マイナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#0d0d0d;
  color:#fff;
  font-family:'Helvetica Neue',Arial,sans-serif;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ===== 地図 ===== */
#map-wrap { position:relative; flex:1; min-height:0; }
#map { width:100%; height:100%; }

#gps-badge {
  position:absolute; top:8px; left:8px; z-index:1000;
  background:rgba(0,0,0,0.75); border-radius:20px;
  padding:5px 10px; font-size:11px; color:#666; pointer-events:none;
}
#gps-badge.good { color:#44cc44; }
#gps-badge.bad { color:#cc4444; }

#follow-btn {
  position:absolute; bottom:12px; right:12px; z-index:1000;
  width:44px; height:44px; border-radius:50%;
  border:2px solid #444; background:rgba(0,0,0,0.8);
  color:#888; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#follow-btn.active { background:#f0a500; color:#000; border-color:#f0a500; }

/* ===== 下パネル（スマホ縦・PC共通） ===== */
#bottom {
  background:#111;
  border-top:2px solid #f0a500;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
}

/* ===== ナビバー ===== */
#nav-bar {
  background:#000;
  padding:10px 14px 8px;
  border-bottom:2px solid #333;
  flex-shrink:0;
  display:none;
}
#nav-bar.show { display:block; }
#nav-label { font-size:11px; color:#666; letter-spacing:0.1em; margin-bottom:2px; }
#nav-name { font-size:20px; font-weight:700; color:#f0a500; line-height:1.2; }
#nav-memo-txt { font-size:12px; color:#aaa; margin-top:2px; }
#nav-sub { font-size:11px; color:#555; margin-top:4px; }

/* ===== コントロール行 ===== */
#controls {
  padding:8px 10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  border-bottom:1px solid #222;
  flex-shrink:0;
}
#search-row { display:flex; gap:6px; }
#search-input {
  flex:1; background:#1a1a1a; border:1px solid #333;
  border-radius:6px; color:#fff; padding:8px 10px;
  font-size:13px; outline:none;
}
#search-input:focus { border-color:#f0a500; }
#search-input::placeholder { color:#444; }
#btn-row { display:flex; gap:6px; flex-wrap:wrap; }

.btn {
  padding:8px 12px; border:none; border-radius:6px;
  font-size:12px; font-weight:700; cursor:pointer;
  white-space:nowrap; transition:all 0.15s;
}
.btn-orange { background:#f0a500; color:#000; }
.btn-orange:hover { background:#ffb820; }
.btn-gray { background:#222; color:#aaa; border:1px solid #333; }
.btn-gray:hover { background:#2a2a2a; color:#ddd; }
.btn-red { background:#2a0000; color:#ff6666; border:1px solid #500; }
.btn-red:hover { background:#3a0000; }
.btn-green { background:#003a00; color:#66ff66; border:1px solid #050; }
.btn-green:hover { background:#004a00; }
.btn-nav-stop { background:#cc0000; color:#fff; }
.btn-add-active { background:#ff4400; color:#fff; }
#btn-add { flex:1; }
#btn-nav { flex:1; }

/* ===== ポイントリスト ===== */
#points-wrap {
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  max-height:160px;
}
#points-wrap::-webkit-scrollbar { width:3px; }
#points-wrap::-webkit-scrollbar-thumb { background:#333; }

.point-row {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; border-bottom:1px solid #1a1a1a;
}
.point-num {
  width:26px; height:26px; border-radius:50%;
  background:#222; border:2px solid #f0a500;
  color:#f0a500; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.point-num.cur { background:#f0a500; color:#000; }
.point-num.done { border-color:#333; color:#444; }
.point-info { flex:1; min-width:0; cursor:pointer; }
.point-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.point-memo-label { font-size:10px; color:#f0a500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.point-del { background:none; border:none; color:#333; font-size:16px; cursor:pointer; padding:2px 6px; flex-shrink:0; }
.point-del:hover { color:#ff6666; }
.empty-msg { text-align:center; padding:20px 16px; color:#444; font-size:12px; line-height:2; }

/* ===== スマホ横向き ===== */
@media (orientation:landscape) and (max-width:900px) {
  body { flex-direction:row; }
  #map-wrap { flex:1; height:100dvh; }
  #bottom {
    width:180px; height:100dvh;
    border-top:none; border-left:2px solid #f0a500;
    overflow-y:auto;
  }
  #points-wrap { max-height:none; flex:1; }
  #nav-name { font-size:14px; }
}

/* ===== PC（横幅900px以上） ===== */
@media (min-width:900px) {
  body { flex-direction:column; }

  #map-wrap { flex:1; }

  #bottom {
    border-top:2px solid #f0a500;
    flex-shrink:0;
    height:auto;
  }

  #nav-bar { padding:8px 16px; }
  #nav-name { font-size:18px; }

  /* コントロールを横並びに */
  #controls {
    flex-direction:row;
    align-items:center;
    padding:8px 16px;
    gap:8px;
  }
  #search-row { flex:1; }
  #btn-row { flex-shrink:0; flex-wrap:nowrap; }
  #btn-add { flex:none; }
  #btn-nav { flex:none; }

  /* ポイントリストを横スクロール */
  #points-wrap {
    max-height:none;
    height:120px;
    display:flex;
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
    border-top:1px solid #222;
  }
  #points-wrap::-webkit-scrollbar { height:3px; }

  .point-row {
    flex-direction:column;
    align-items:flex-start;
    min-width:140px;
    max-width:140px;
    border-bottom:none;
    border-right:1px solid #1a1a1a;
    padding:10px 12px;
    gap:4px;
  }
  .point-name { white-space:normal; font-size:11px; }
  .empty-msg { min-width:300px; }
}
</style>
</head>
<body>

<div id="map-wrap">
  <div id="map"></div>
  <div id="gps-badge">📡 GPS待機中</div>
  <button id="follow-btn" onclick="toggleFollow()">🧭</button>
</div>

<div id="bottom">
  <div id="nav-bar">
    <div id="nav-label">次のポイントへ</div>
    <div id="nav-name">—</div>
    <div id="nav-memo-txt"></div>
    <div id="nav-sub"></div>
  </div>
  <div id="controls">
    <div id="search-row">
      <input type="text" id="search-input" placeholder="🔍 住所・場所を検索">
      <button class="btn btn-orange" onclick="searchAddress()">検索</button>
    </div>
    <div id="btn-row">
      <button class="btn btn-gray" id="btn-add" onclick="toggleAddMode()">＋ タップ追加</button>
      <button class="btn btn-green" id="btn-nav" onclick="toggleNav()">▶ ナビ開始</button>
      <button class="btn btn-gray" onclick="saveRoute()" title="保存">💾 保存</button>
      <button class="btn btn-gray" onclick="loadRoute()" title="読み込み">📂 読込</button>
      <button class="btn btn-red" onclick="clearAll()" title="削除">🗑</button>
    </div>
  </div>
  <div id="points-wrap">
    <div class="empty-msg">ポイントがありません<br>住所検索かタップで追加</div>
  </div>
</div>

<!-- モーダル -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:flex-end;justify-content:center;">
  <div id="modal" style="background:#1a1a1a;border-radius:16px 16px 0 0;padding:20px 18px 36px;width:100%;max-width:500px;border-top:1px solid #333;">
    <h3 id="modal-title" style="font-size:14px;color:#f0a500;margin-bottom:14px;"></h3>
    <div style="font-size:10px;color:#555;margin-bottom:4px;letter-spacing:0.1em;text-transform:uppercase;">ポイント名</div>
    <input type="text" id="modal-name" placeholder="例: ○○工場、△△倉庫"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;">
    <div style="font-size:10px;color:#555;margin-bottom:4px;letter-spacing:0.1em;text-transform:uppercase;">メモ（曲がり方向など）</div>
    <textarea id="modal-memo-input" placeholder="例: 右折して200m先&#10;門の前で停車"
      style="width:100%;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;resize:none;height:60px;"></textarea>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-gray" onclick="cancelModal()" style="flex:1;padding:12px;font-size:14px;">キャンセル</button>
      <button class="btn btn-orange" id="modal-ok" onclick="confirmModal()" style="flex:1;padding:12px;font-size:14px;">追加</button>
    </div>
  </div>
</div>

<script>
const MAPTILER_KEY = 'RXZt95T89eK6jTrAs2kn';
const map = L.map('map', { center:[35.68,139.75], zoom:14, zoomControl:false });
L.tileLayer(`https://api.maptiler.com/maps/jp-gsi-standard/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
  attribution:'© <a href="https://www.maptiler.com/">MapTiler</a> © OpenStreetMap',
  maxZoom:19, tileSize:256
}).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);

let points=[], polyline=null, addMode=false;
let navActive=false, navIndex=0;
let followMode=false, gpsMarker=null, gpsCircle=null;
let pendingLatLng=null, editingId=null;

map.on('click', e => { if (addMode) openModal(e.latlng, null); });

function toggleAddMode() {
  addMode = !addMode;
  const btn = document.getElementById('btn-add');
  if (addMode) { btn.textContent='✕ 追加終了'; btn.className='btn btn-add-active'; }
  else { btn.textContent='＋ タップ追加'; btn.className='btn btn-gray'; }
}

function openModal(latlng, id) {
  pendingLatLng=latlng; editingId=id;
  const isEdit=id!==null;
  document.getElementById('modal-title').textContent=isEdit?'ポイントを編集':`ポイント ${points.length+1} を追加`;
  document.getElementById('modal-ok').textContent=isEdit?'保存':'追加';
  if (isEdit) { const p=points.find(x=>x.id===id); document.getElementById('modal-name').value=p.name; document.getElementById('modal-memo-input').value=p.memo; }
  else { document.getElementById('modal-name').value=''; document.getElementById('modal-memo-input').value=''; }
  const mo=document.getElementById('modal-overlay');
  mo.style.display='flex';
  setTimeout(()=>document.getElementById('modal-name').focus(),100);
}

function cancelModal() {
  document.getElementById('modal-overlay').style.display='none';
  pendingLatLng=null; editingId=null;
}

function confirmModal() {
  const name=document.getElementById('modal-name').value.trim();
  const memo=document.getElementById('modal-memo-input').value.trim();
  if (editingId!==null) {
    const p=points.find(x=>x.id===editingId);
    p.name=name||p.name; p.memo=memo;
    refreshAllMarkers(); renderList();
  } else {
    if(!pendingLatLng)return;
    const p={id:Date.now(),lat:pendingLatLng.lat,lng:pendingLatLng.lng,name:name||`ポイント ${points.length+1}`,memo,marker:null};
    addMarker(p,points.length); points.push(p);
    updatePolyline(); renderList();
  }
  document.getElementById('modal-overlay').style.display='none';
  pendingLatLng=null; editingId=null;
}

document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)cancelModal();});

function makeIcon(idx,state) {
  const c=state==='cur'?['#00aaff','#fff']:state==='done'?['#333','#555']:['#f0a500','#000'];
  const n=idx+1,fs=n>=100?9:n>=10?11:14;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44"><path d="M17 0C7.6 0 0 7.6 0 17c0 11 17 27 17 27s17-16 17-27C34 7.6 26.4 0 17 0z" fill="${c[0]}"/><circle cx="17" cy="17" r="11" fill="#fff" opacity="0.95"/><text x="17" y="${17+fs*0.4}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="${c[0]}">${n}</text></svg>`;
  return L.divIcon({html:svg,iconSize:[34,44],iconAnchor:[17,44],className:''});
}

function getState(idx){if(!navActive)return'normal';if(idx<navIndex)return'done';if(idx===navIndex)return'cur';return'normal';}

function addMarker(p,idx){
  const m=L.marker([p.lat,p.lng],{icon:makeIcon(idx,getState(idx)),draggable:true}).addTo(map);
  m.bindTooltip(`<b>${idx+1}. ${p.name}</b>${p.memo?'<br><span style="color:#f0a500">'+p.memo+'</span>':''}`,{direction:'top',offset:[0,-40]});
  m.on('click',()=>{if(!addMode)openModal(null,p.id);});
  m.on('dragend',e=>{p.lat=e.target.getLatLng().lat;p.lng=e.target.getLatLng().lng;updatePolyline();});
  p.marker=m;
}

function refreshAllMarkers(){points.forEach((p,i)=>{if(!p.marker)return;p.marker.setIcon(makeIcon(i,getState(i)));p.marker.setTooltipContent(`<b>${i+1}. ${p.name}</b>${p.memo?'<br><span style="color:#f0a500">'+p.memo+'</span>':''}`);});}

async function updatePolyline(){
  if(polyline){map.removeLayer(polyline);polyline=null;}
  if(points.length<2)return;
  polyline=L.polyline(points.map(p=>[p.lat,p.lng]),{color:'#f0a500',weight:3,opacity:0.4,dashArray:'6,6'}).addTo(map);
  try{
    const coords=points.map(p=>p.lng+','+p.lat).join(';');
    const res=await fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&continue_straight=true');
    const data=await res.json();
    if(data.code!=='Ok'||!data.routes.length)return;
    if(polyline)map.removeLayer(polyline);
    polyline=L.geoJSON(data.routes[0].geometry,{style:{color:'#f0a500',weight:5,opacity:0.85}}).addTo(map);
  }catch(e){console.warn('OSRM失敗',e);}
}

function renderList(){
  const el=document.getElementById('points-wrap');
  if(!points.length){el.innerHTML='<div class="empty-msg">ポイントがありません<br>住所検索かタップで追加</div>';return;}
  el.innerHTML=points.map((p,i)=>`
    <div class="point-row">
      <div class="point-num ${getState(i)}">${i+1}</div>
      <div class="point-info" onclick="focusPoint(${p.id})">
        <div class="point-name">${p.name}</div>
        ${p.memo?`<div class="point-memo-label">📝 ${p.memo}</div>`:''}
      </div>
      <button class="point-del" onclick="deletePoint(${p.id})">✕</button>
    </div>`).join('');
  if(navActive){const rows=el.querySelectorAll('.point-row');if(rows[navIndex])rows[navIndex].scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function focusPoint(id){const p=points.find(x=>x.id===id);if(p)map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));}
function deletePoint(id){const i=points.findIndex(x=>x.id===id);if(i===-1)return;map.removeLayer(points[i].marker);points.splice(i,1);refreshAllMarkers();updatePolyline();renderList();}

async function searchAddress(){
  const q=document.getElementById('search-input').value.trim();if(!q)return;
  const btn=document.querySelector('#search-row .btn-orange');btn.textContent='...';btn.disabled=true;
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=ja&countrycodes=jp`);
    const data=await res.json();
    if(!data.length){alert('見つかりませんでした');return;}
    const{lat,lon,display_name}=data[0];
    map.setView([parseFloat(lat),parseFloat(lon)],17);
    document.getElementById('modal-name').value=display_name.split('、')[0].split(',')[0].trim();
    openModal({lat:parseFloat(lat),lng:parseFloat(lon)},null);
    document.getElementById('search-input').value='';
  }catch{alert('検索失敗');}
  finally{btn.textContent='検索';btn.disabled=false;}
}
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')searchAddress();});

function startGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(onGPS,onGPSErr,{enableHighAccuracy:true,maximumAge:2000,timeout:10000});
}

function onGPS(pos){
  const{latitude:lat,longitude:lng,accuracy}=pos.coords;
  const b=document.getElementById('gps-badge');
  b.textContent=`📡 精度 ±${Math.round(accuracy)}m`;
  b.className=accuracy<30?'good':accuracy<100?'':'bad';
  if(!gpsMarker){
    gpsMarker=L.circleMarker([lat,lng],{radius:9,color:'#00aaff',fillColor:'#00aaff',fillOpacity:1,weight:3}).addTo(map);
    gpsCircle=L.circle([lat,lng],{radius:accuracy,color:'#00aaff',fillColor:'#00aaff',fillOpacity:0.08,weight:1}).addTo(map);
  }else{gpsMarker.setLatLng([lat,lng]);gpsCircle.setLatLng([lat,lng]).setRadius(accuracy);}
  if(followMode)map.panTo([lat,lng]);
  if(navActive)checkProgress(lat,lng);
}

function onGPSErr(){const b=document.getElementById('gps-badge');b.textContent='📡 GPS失敗';b.className='bad';}

function toggleFollow(){
  followMode=!followMode;
  document.getElementById('follow-btn').classList.toggle('active',followMode);
  if(followMode&&gpsMarker)map.panTo(gpsMarker.getLatLng());
}
map.on('dragstart',()=>{followMode=false;document.getElementById('follow-btn').classList.remove('active');});

const REACH=40;
function toggleNav(){navActive?stopNav():startNav();}

function startNav(){
  if(!points.length){alert('ポイントがありません');return;}
  navActive=true;navIndex=0;
  const btn=document.getElementById('btn-nav');btn.textContent='■ 停止';btn.className='btn btn-nav-stop';
  document.getElementById('nav-bar').classList.add('show');
  followMode=true;document.getElementById('follow-btn').classList.add('active');
  refreshAllMarkers();renderList();updateNavBar();
  speak(`ナビ開始。最初は${points[0].name}。${points[0].memo||''}`);
}

function stopNav(){
  navActive=false;
  const btn=document.getElementById('btn-nav');btn.textContent='▶ ナビ開始';btn.className='btn btn-green';
  document.getElementById('nav-bar').classList.remove('show');
  refreshAllMarkers();renderList();
}

function updateNavBar(){
  if(!navActive||!points.length)return;
  const p=points[navIndex],next=points[navIndex+1];
  document.getElementById('nav-label').textContent=`${navIndex+1} / ${points.length}`;
  document.getElementById('nav-name').textContent=p.name;
  document.getElementById('nav-memo-txt').textContent=p.memo||'';
  document.getElementById('nav-sub').textContent=next?`次: ${next.name}`:'🏁 ゴール';
}

function checkProgress(lat,lng){
  if(!navActive||navIndex>=points.length)return;
  const t=points[navIndex];
  if(calcDist(lat,lng,t.lat,t.lng)<REACH){
    speak(`${t.name}、到達`);navIndex++;
    if(navIndex>=points.length){speak('ゴールです。お疲れ様でした。');stopNav();alert('🏁 ゴール！');return;}
    refreshAllMarkers();renderList();updateNavBar();
    speak(`次は${points[navIndex].name}。${points[navIndex].memo||''}`);
  }
}

function calcDist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=0.95;speechSynthesis.speak(u);}

function saveRoute(){
  if(!points.length){alert('ポイントがありません');return;}
  const data={version:1,points:points.map(p=>({lat:p.lat,lng:p.lng,name:p.name,memo:p.memo}))};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`route-${new Date().toISOString().slice(0,10)}.json`;a.click();
}

function loadRoute(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);clearAll(true);
        data.points.forEach((d,i)=>{const p={id:Date.now()+i,lat:d.lat,lng:d.lng,name:d.name,memo:d.memo||'',marker:null};addMarker(p,i);points.push(p);});
        updatePolyline();renderList();
        if(points.length)map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
      }catch{alert('読み込み失敗');}
    };
    reader.readAsText(e.target.files[0]);
  };input.click();
}

function clearAll(silent=false){
  if(!silent&&points.length&&!confirm('全ポイントを削除しますか？'))return;
  points.forEach(p=>{if(p.marker)map.removeLayer(p.marker);});
  points=[];if(polyline){map.removeLayer(polyline);polyline=null;}
  if(navActive)stopNav();renderList();
}

startGPS();
renderList();
</script>
</body>
</html>
